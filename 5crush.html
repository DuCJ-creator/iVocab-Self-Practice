
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Vocab Crush｜單字消消樂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root{--ink:#183044;--muted:#687c8e;--paper:#f4f8f7;--card:#fff;--line:#dce7e5;--mint:#23a18f;--mint2:#dff4ef;--blue:#4178a2;--blue2:#e8f1f7;--amber:#f1ad45;--rose:#de6b67;--shadow:0 18px 50px rgba(24,48,68,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    button,select{font:inherit}
    body{min-height:100dvh;background:linear-gradient(rgba(35,161,143,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(35,161,143,.04) 1px,transparent 1px),radial-gradient(circle at 10% 5%,rgba(35,161,143,.13),transparent 30%),radial-gradient(circle at 95% 90%,rgba(241,173,69,.13),transparent 32%),var(--paper);background-size:28px 28px,28px 28px,auto,auto,auto;color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif;user-select:none;padding:18px}
    .shell{width:min(1080px,100%);margin:auto;min-height:calc(100dvh - 36px);display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 2px 16px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.02em}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--ink);color:#fff;font-size:.82rem;box-shadow:inset 0 -3px rgba(255,255,255,.12)}
    .brand small{display:block;color:var(--muted);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;margin-top:1px}
    .best{padding:8px 12px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.78rem}.best strong{color:var(--mint);margin-left:6px}
    .panel{background:rgba(255,255,255,.92);border:1px solid rgba(220,231,229,.9);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;flex:1}
    .setup{display:grid;grid-template-columns:1.05fr .95fr;min-height:650px}
    .intro{padding:64px 56px;background:linear-gradient(150deg,#173044,#254e60);color:#fff;position:relative;overflow:hidden}
    .intro:after{content:'';position:absolute;width:280px;height:280px;border:60px solid rgba(35,161,143,.22);border-radius:50%;right:-130px;bottom:-120px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:#aee4d9;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.eyebrow:before{content:'';width:24px;height:2px;background:var(--amber)}
    h1{font-size:clamp(42px,6vw,68px);line-height:.96;letter-spacing:-.055em;margin:22px 0 20px}.intro h1 span{display:block;color:#6bd2bf}
    .intro p{color:#c6d7de;line-height:1.75;max-width:440px;font-size:.96rem}
    .rules{display:grid;gap:12px;margin-top:40px}.rule{display:flex;align-items:flex-start;gap:12px;color:#dce8ec;font-size:.84rem}.rule b{flex:0 0 25px;height:25px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.1);color:#8de0d0}
    .controls{padding:52px 48px;display:flex;flex-direction:column;justify-content:center}.section-label{font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:22px 0 10px}.section-label:first-child{margin-top:0}
    .choice-grid{display:grid;gap:9px}.levels{grid-template-columns:repeat(3,1fr)}.times{grid-template-columns:repeat(3,1fr)}.units{grid-template-columns:repeat(2,1fr);max-height:196px;overflow:auto;padding-right:4px}
    .choice{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px;border-radius:12px;cursor:pointer;font-weight:700;transition:.18s}.choice:hover{border-color:var(--mint);transform:translateY(-1px)}.choice.active{background:var(--mint2);border-color:var(--mint);color:#147565;box-shadow:inset 0 0 0 1px var(--mint)}
    .primary{margin-top:26px;border:0;border-radius:13px;padding:15px 20px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;transition:.2s}.primary:hover{background:#254e60;transform:translateY(-1px);box-shadow:0 10px 22px rgba(24,48,68,.18)}.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
    .loading{min-height:650px;display:grid;place-items:center;text-align:center;color:var(--muted)}.loader{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}
    .game{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;min-height:650px}
    .play-area{display:flex;align-items:center;justify-content:center;min-width:0;background:linear-gradient(145deg,#eef6f4,#f8faf9);border:1px solid var(--line);border-radius:18px;padding:14px}
    .board{width:min(100%,560px);aspect-ratio:4/5;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:9px;padding:10px;background:#dce9e6;border-radius:18px;box-shadow:inset 0 2px 8px rgba(24,48,68,.08)}
    .tile{min-width:0;border:1px solid rgba(255,255,255,.85);border-radius:13px;background:#fff;box-shadow:0 4px 10px rgba(24,48,68,.09);padding:7px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-size:clamp(.68rem,1.5vw,.92rem);font-weight:700;line-height:1.22;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;overflow-wrap:anywhere;position:relative}
    .tile.word{background:linear-gradient(145deg,#fff,#edf5fa);border-color:#c6dae8;color:#285f85}.tile.meaning{background:linear-gradient(145deg,#fff,#eaf7f3);border-color:#bfe2d9;color:#167565}.tile:before{content:attr(data-kind);position:absolute;top:6px;left:7px;font-size:.48rem;letter-spacing:.08em;opacity:.55}.tile:hover{transform:translateY(-2px);box-shadow:0 7px 14px rgba(24,48,68,.13)}.tile.selected{transform:scale(.94);border:2px solid var(--amber);box-shadow:0 0 0 4px rgba(241,173,69,.22)}.tile.hint{animation:hint 1s ease infinite}.tile.matched{animation:pop .34s ease forwards}.tile.empty{visibility:hidden;pointer-events:none}.tile.spawn{animation:spawn .3s ease}.tile.invalid{animation:shake .3s ease}
    @keyframes hint{50%{box-shadow:0 0 0 5px rgba(35,161,143,.25);transform:translateY(-3px)}}@keyframes pop{50%{transform:scale(1.12)}to{transform:scale(0);opacity:0}}@keyframes spawn{from{transform:translateY(-22px);opacity:0}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    .side{display:flex;flex-direction:column;gap:12px}.hud-card{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.hud-card.accent{background:var(--ink);color:#fff;border-color:var(--ink)}
    .hud-label{color:var(--muted);font-size:.65rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700}.accent .hud-label{color:#9fb2bf}.score{font-size:2.25rem;line-height:1;font-weight:700;margin-top:6px;letter-spacing:-.04em}.combo{color:#76d8c5;font-size:.78rem;margin-top:7px;min-height:18px}.time{font-size:1.55rem;font-weight:700;margin-top:4px}.time.warn{color:var(--amber)}.time.danger{color:var(--rose);animation:pulse .7s infinite}@keyframes pulse{50%{opacity:.5}}
    .mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{padding:11px;border:1px solid var(--line);border-radius:12px;background:#f8faf9}.mini strong{display:block;font-size:1.05rem}.mini span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .notice{font-size:.78rem;line-height:1.55;color:var(--muted);min-height:50px}.notice strong{color:var(--ink)}
    .actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;color:var(--ink);cursor:pointer;font-size:.78rem;font-weight:700}.action:hover{border-color:var(--mint);color:var(--mint)}.action.danger{color:var(--rose)}.action.full{grid-column:1/-1;background:var(--mint2);border-color:#bfe2d9;color:#167565}
    .overlay{position:fixed;inset:0;background:rgba(24,48,68,.55);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(440px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:var(--shadow);text-align:center}.modal .tag{color:var(--mint);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.modal h2{font-size:2rem;margin:10px 0 6px;letter-spacing:-.035em}.modal p{color:var(--muted)}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.result{background:#f3f7f6;border-radius:12px;padding:12px 6px}.result strong{display:block;font-size:1.25rem}.result span{font-size:.62rem;color:var(--muted);text-transform:uppercase}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}
    .toast{position:fixed;top:24px;left:50%;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 15px;font-size:.78rem;font-weight:700;z-index:80;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:780px){body{padding:10px}.shell{min-height:calc(100dvh - 20px)}.topbar{padding-bottom:10px}.setup{grid-template-columns:1fr;min-height:auto}.intro{padding:34px 26px}.intro h1{font-size:46px}.rules{display:none}.controls{padding:28px 22px}.game{grid-template-columns:1fr;padding:10px;gap:10px;min-height:auto}.play-area{padding:7px}.board{gap:6px;padding:7px;width:min(100%,430px)}.tile{border-radius:10px;padding:5px;font-size:clamp(.58rem,2.7vw,.78rem)}.tile:before{display:none}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hud-card{padding:10px}.hud-card.accent{grid-row:span 2}.mini-stats{display:none}.notice{display:none}.actions{grid-column:1/-1;grid-template-columns:repeat(4,1fr);margin:0}.action.full{grid-column:auto}.score{font-size:1.8rem}.time{font-size:1.2rem}.panel{border-radius:18px}.best{font-size:.7rem}.brand small{display:none}}
    @media(max-width:430px){.actions{grid-template-columns:repeat(2,1fr)}.action.full{grid-column:1/-1}.game{padding:7px}.board{gap:5px}.topbar{padding-top:0}.result-grid{grid-template-columns:1fr 1fr}.result:last-child{grid-column:1/-1}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><span class="mark">VC</span><div>Vocab Crush<small>Word pairing puzzle</small></div></div><div class="best">PERSONAL BEST <strong id="bestScore">0</strong></div></header>
  <section id="app" class="panel"></section>
</main>
<div id="toast" class="toast"></div>
<script>
const ROWS=5,COLS=4,BOARD_PAIRS=10;
const CSV_URLS=Array.from({length:6},(_,i)=>`https://raw.githubusercontent.com/DuCJ-creator/iVocab-Self-Practice/main/level${i+1}.csv`);
const state={level:1,time:180,unitStart:1,board:[],queue:[],selected:null,score:0,moves:0,matches:0,combo:0,maxCombo:0,timeLeft:180,timer:null,active:false,locked:false,paused:false,hints:2,shuffles:2,spawned:new Set(),marked:new Set(),invalid:new Set()};
const app=document.getElementById('app');
document.getElementById('bestScore').textContent=localStorage.getItem('vocabCrushBest')||0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const key=(r,c)=>`${r}-${c}`;
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1300)}
function tone(freq=520,d=.08){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=window._vcAudio||(window._vcAudio=new C());const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function loadWords(level){return new Promise(resolve=>Papa.parse(CSV_URLS[level-1],{download:true,header:true,complete:res=>resolve(res.data.filter(r=>r.Level&&r.Unit&&r.Word&&r['Chinese Meaning']).map((r,i)=>({id:`${level}-${r.Unit}-${i}`,unit:+r.Unit,word:r.Word.trim(),meaning:r['Chinese Meaning'].replace(/;/g,'；').trim(),pos:(r['Part of Speech']||r.POS||'').trim()}))),error:()=>resolve([])}))}
function renderSetup(){state.active=false;clearInterval(state.timer);app.innerHTML=`<div class="setup"><section class="intro"><div class="eyebrow">Vocabulary puzzle</div><h1>Swap. Pair.<span>Crush.</span></h1><p>交換相鄰方塊，辨認英文單字與正確中文意思。只有你主動完成的配對才會消除；連續答對越多，分數越高。</p><div class="rules"><div class="rule"><b>1</b><span>點兩個相鄰方塊進行交換</span></div><div class="rule"><b>2</b><span>英文與正確中文相鄰即可消除</span></div><div class="rule"><b>3</b><span>新方塊不會自動配對，連續答對可加分</span></div></div></section><section class="controls"><div class="section-label">01 · Level</div><div class="choice-grid levels">${[1,2,3,4,5,6].map(n=>`<button class="choice ${state.level===n?'active':''}" onclick="pick('level',${n})">L${n}</button>`).join('')}</div><div class="section-label">02 · Time</div><div class="choice-grid times">${[[180,'3 min'],[300,'5 min'],[600,'10 min']].map(([n,t])=>`<button class="choice ${state.time===n?'active':''}" onclick="pick('time',${n})">${t}</button>`).join('')}</div><div class="section-label">03 · Units</div><div class="choice-grid units">${Array.from({length:10},(_,i)=>i*5+1).map(n=>`<button class="choice ${state.unitStart===n?'active':''}" onclick="pick('unitStart',${n})">Unit ${n}–${n+4}</button>`).join('')}</div><button class="primary" onclick="startGame()">Start game →</button></section></div>`}
function pick(k,v){state[k]=v;renderSetup()}
async function startGame(){app.innerHTML='<div class="loading"><div><div class="loader"></div>正在準備單字棋盤…</div></div>';const all=await loadWords(state.level);const words=shuffle(all.filter(w=>w.unit>=state.unitStart&&w.unit<state.unitStart+5));if(words.length<BOARD_PAIRS){toast('這組單字不足，請選其他單元');renderSetup();return}const pairs=words.map(w=>({id:w.id,tiles:[{pairId:w.id,type:'word',text:w.pos?`${w.word} · ${w.pos}`:w.word},{pairId:w.id,type:'meaning',text:w.meaning}]}));const first=pairs.slice(0,BOARD_PAIRS),rest=pairs.slice(BOARD_PAIRS);state.board=Array(ROWS).fill(0).map(()=>Array(COLS).fill(null));shuffle(first.flatMap(p=>p.tiles)).forEach((t,i)=>state.board[Math.floor(i/COLS)][i%COLS]=t);state.queue=rest;state.score=state.moves=state.matches=state.combo=state.maxCombo=0;state.timeLeft=state.time;state.selected=null;state.active=true;state.locked=false;state.paused=false;state.hints=2;state.shuffles=2;preparePlayableBoard();renderGame();startTimer()}
function preparePlayableBoard(){for(let n=0;n<300;n++){if(findMatches().length===0&&findValidMove())return;const tiles=shuffle(state.board.flat().filter(Boolean));tiles.forEach((t,i)=>state.board[Math.floor(i/COLS)][i%COLS]=t)}}
function findMatches(){const found=new Map();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const a=state.board[r][c];if(!a)continue;[[1,0],[0,1]].forEach(([dr,dc])=>{const nr=r+dr,nc=c+dc,b=state.board[nr]?.[nc];if(b&&a.pairId===b.pairId&&a.type!==b.type)found.set(a.pairId,[{r,c},{r:nr,c:nc}])})}return [...found.values()]}
function swap(a,b){[state.board[a.r][a.c],state.board[b.r][b.c]]=[state.board[b.r][b.c],state.board[a.r][a.c]]}
function findValidMove(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of [[0,1],[1,0]]){const b={r:r+dr,c:c+dc};if(!state.board[b.r]?.[b.c])continue;const a={r,c};swap(a,b);const ok=findMatches().length>0;swap(a,b);if(ok)return[a,b]}return null}
function renderGame(){app.innerHTML=`<div class="game"><div class="play-area"><div class="board">${state.board.flatMap((row,r)=>row.map((t,c)=>!t?'<div class="tile empty"></div>':`<button aria-label="${t.text}" class="tile ${t.type} ${state.selected?.r===r&&state.selected?.c===c?'selected':''} ${state.marked.has(key(r,c))?'matched':''} ${state.spawned.has(key(r,c))?'spawn':''} ${state.invalid.has(key(r,c))?'invalid':''}" data-kind="${t.type==='word'?'EN':'中'}" data-pos="${key(r,c)}" onclick="choose(${r},${c})">${t.text}</button>`)).join('')}</div></div><aside class="side"><div class="hud-card accent"><div class="hud-label">Score</div><div class="score">${state.score.toLocaleString()}</div><div class="combo">${state.combo>1?`Correct streak × ${state.combo}`:'Build a correct streak'}</div></div><div class="hud-card"><div class="hud-label">Time left</div><div class="time ${state.timeLeft<=10?'danger':state.timeLeft<=30?'warn':''}">${formatTime(state.timeLeft)}</div></div><div class="mini-stats"><div class="mini"><strong>${state.moves}</strong><span>Moves</span></div><div class="mini"><strong>${state.matches}</strong><span>Pairs</span></div></div><div class="hud-card notice"><strong>${state.paused?'遊戲已暫停':'交換相鄰方塊'}</strong><br>${state.paused?'按下繼續即可回到棋盤':'只有你主動完成的配對才會消除。'}</div><div class="actions"><button class="action" onclick="useHint()">Hint · ${state.hints}</button><button class="action" onclick="manualShuffle()">Shuffle · ${state.shuffles}</button><button class="action" onclick="togglePause()">${state.paused?'Resume':'Pause'}</button><button class="action danger" onclick="finish('提前結束')">End</button><button class="action full" onclick="renderSetup()">Change level / units</button></div></aside></div>`;if(state.paused)app.insertAdjacentHTML('beforeend','<div class="overlay"><div class="modal"><div class="tag">Take a breath</div><h2>Paused</h2><p>計時已暫停，準備好再繼續。</p><button class="primary" onclick="togglePause()">Resume game</button></div></div>')}
async function choose(r,c){if(!state.active||state.locked||state.paused||!state.board[r][c])return;const pos={r,c};if(!state.selected){state.selected=pos;tone(390,.05);renderGame();return}if(state.selected.r===r&&state.selected.c===c){state.selected=null;renderGame();return}if(!adjacent(state.selected,pos)){state.selected=pos;tone(390,.05);renderGame();return}const first=state.selected;state.selected=null;state.locked=true;state.moves++;swap(first,pos);renderGame();await sleep(160);if(!findMatches().length){state.invalid=new Set([key(first.r,first.c),key(pos.r,pos.c)]);renderGame();tone(180,.12);await sleep(300);swap(first,pos);state.invalid.clear();state.combo=0;state.locked=false;renderGame();return}await resolveBoard()}
async function resolveBoard(){const matches=findMatches();if(!matches.length){state.locked=false;return}state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);state.marked=new Set(matches.flat().map(p=>key(p.r,p.c)));state.score+=matches.length*100*state.combo;state.matches+=matches.length;tone(520+Math.min(state.combo,6)*70,.1);renderGame();await sleep(360);for(const group of matches)for(const p of group)state.board[p.r][p.c]=null;state.marked.clear();dropAndRefill();stabilizeBoard();renderGame();await sleep(260);state.spawned.clear();state.locked=false;if(state.board.flat().filter(Boolean).length<2){finish('本組完成');return}renderGame()}
function dropAndRefill(){for(let c=0;c<COLS;c++){let w=ROWS-1;for(let r=ROWS-1;r>=0;r--)if(state.board[r][c]){state.board[w][c]=state.board[r][c];if(w!==r)state.board[r][c]=null;w--}while(w>=0)state.board[w--][c]=null}let holes=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!state.board[r][c])holes.push({r,c});while(holes.length>=2&&state.queue.length){const p=state.queue.shift(),spots=holes.splice(0,2);spots.forEach((s,i)=>{state.board[s.r][s.c]=p.tiles[i];state.spawned.add(key(s.r,s.c))})}}
function stabilizeBoard(){for(let pass=0;pass<40;pass++){const matches=findMatches();if(!matches.length){if(!findValidMove()){toast('沒有可用步數，已自動洗牌');shuffleVisible()}return}const cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(state.board[r][c])cells.push({r,c});const source=shuffle(matches.flat())[0];let moved=false;for(const target of shuffle(cells)){if(source.r===target.r&&source.c===target.c)continue;swap(source,target);if(findMatches().length<matches.length){moved=true;break}swap(source,target)}if(!moved)break}shuffleVisible()}
function shuffleVisible(){const tiles=shuffle(state.board.flat().filter(Boolean));const spots=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(state.board[r][c])spots.push({r,c});for(let n=0;n<300;n++){const order=shuffle(tiles);spots.forEach((s,i)=>state.board[s.r][s.c]=order[i]);if(findMatches().length===0&&findValidMove())break}}
function useHint(){if(!state.active||state.locked||state.paused)return;if(state.hints<=0){toast('提示已用完');return}const move=findValidMove();if(!move){shuffleVisible();renderGame();return}state.hints--;document.querySelectorAll('.tile').forEach(el=>{if(move.some(p=>el.dataset.pos===key(p.r,p.c)))el.classList.add('hint')});setTimeout(renderGame,1300)}
function manualShuffle(){if(!state.active||state.locked||state.paused)return;if(state.shuffles<=0){toast('洗牌次數已用完');return}state.shuffles--;state.combo=0;shuffleVisible();tone(330,.08);renderGame()}
function startTimer(){clearInterval(state.timer);state.timer=setInterval(()=>{if(!state.active||state.paused)return;state.timeLeft--;if(state.timeLeft<=0)finish('時間到');else renderGame()},1000)}
function togglePause(){if(!state.active)return;state.paused=!state.paused;renderGame()}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function finish(reason){if(!state.active)return;state.active=false;clearInterval(state.timer);const best=Math.max(state.score,+(localStorage.getItem('vocabCrushBest')||0));localStorage.setItem('vocabCrushBest',best);document.getElementById('bestScore').textContent=best;app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><div class="tag">Session complete</div><h2>${reason}</h2><p>這局完成了，看看你的配對成果。</p><div class="result-grid"><div class="result"><strong>${state.score.toLocaleString()}</strong><span>Score</span></div><div class="result"><strong>${state.matches}</strong><span>Pairs</span></div><div class="result"><strong>×${state.maxCombo||1}</strong><span>Best streak</span></div></div><div class="modal-actions"><button class="choice" onclick="renderSetup()">設定</button><button class="primary" style="margin:0" onclick="startGame()">再玩一次</button></div></div></div>`)}
renderSetup();
</script>
</body>
</html>
