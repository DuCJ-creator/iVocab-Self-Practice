    .laser-shot{position:absolute;z-index:18;width:7px;height:24px;border-radius:999px;pointer-events:none;background:linear-gradient(#fff,var(--cyan),#3b8cff);box-shadow:0 0 8px #fff,0 0 18px var(--cyan);transform:translate(-50%,-50%);transition:transform .18s cubic-bezier(.2,.75,.3,1),opacity .18s}.laser-shot:after{content:"";position:absolute;left:2px;top:18px;width:3px;height:45px;background:linear-gradient(var(--cyan),transparent);filter:blur(2px)}.laser-shot.fly{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.65);opacity:.88}.laser-shot.miss{background:linear-gradient(#fff,var(--pink),#ff405f);box-shadow:0 0 9px #fff,0 0 20px var(--pink)}.hit-spark{position:absolute;z-index:19;width:18px;height:18px;border-radius:50%;pointer-events:none;background:#fff;box-shadow:0 0 10px #fff,0 0 25px var(--cyan),0 0 45px var(--violet);animation:sparkPop .35s ease-out forwards}.miss-tag{position:absolute;z-index:19;color:var(--pink);font-weight:900;font-size:.76rem;letter-spacing:.12em;text-shadow:0 0 12px var(--pink);pointer-events:none;animation:missDrift .55s ease-out forwards}.space-explosion{position:absolute;z-index:22;transform:translate(-50%,-50%);font-size:clamp(42px,8vw,76px);pointer-events:none;filter:drop-shadow(0 0 18px #ffd76b);animation:boomPop .62s ease-out forwards}.blast-ring{position:absolute;z-index:21;width:32px;height:32px;border:5px solid #fff3a1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 22px #ff9c3b;animation:ringBlast .65s ease-out forwards}.space-fragment{position:absolute;z-index:20;width:8px;height:8px;border-radius:2px;background:var(--gold);pointer-events:none;box-shadow:0 0 8px #fff;animation:fragmentFly .58s ease-out forwards}.arena.combat-shake{animation:combatShake .36s ease}.arena.heavy-shake{animation:heavyShake .85s ease}.arena.danger-flash:after{content:"";position:absolute;inset:0;z-index:17;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.72),rgba     @keyframes sparkPop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}45%{transform:translate(-50%,-50%) scale(1.9);opacity:1}to{transform:translate(-50%,-50%) scale(.4);opacity:0}}@keyframes missDrift{from{transform:translate(-50%,-50%) scale(.7);opacity:0}35%{opacity:1}to{transform:translate(-50%,-90%) scale(1.15);opacity:0}}@keyframes boomPop{0%{transform:translate(-50%,-50%) scale(.15) rotate(-20deg);opacity:0}42%{transform:translate(-50%,-50%) scale(1.35) rotate(8deg);opacity:1}to{transform:translate(-50%,-50%) scale(2.05);opacity:0}}@keyframes ringBlast{from{transform:translate(-50%,-50%) scale(.25);opacity:1}to{transform:translate(-50%,-50%) scale(7);opacity:0}}@keyframes fragmentFly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) rotate(240deg) scale(.2);opacity:0}}@keyframes combatShake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}@keyframes heavyShake{10%,50%{transform:translate(-10px,4px)}25%,70%{transform:translate(10px,-5px)}40%,85%{transform:translate(-6px,3px)}}@keyframes dangerFlash{0%{opacity:0}25%{opacity:1}55%{opacity:.75}to{opacity:0}}@keyframes meteorBarrage{0%{filter:none}35%{filter:brightness(1.25)}100%{top:45%!important;left:50%!important;transform:translate(-50%,-50%) scale(10) rotate(calc(var(--i)*18deg));filter:brightness(.55) blur(1px);opacity:0}}@keyframes letterImpact{50%{filter:brightness(1.75);transform:translateX(-50%) scale(1.04)}}@keyframes missRecoil{40%{transform:translateX(-50%) rotate(5deg)}70%{transform:translateX(-50%) rotate(-3deg)}}@keyframes letterGlow{0%{color:#fff;text-shadow:0 0 14px #fff;transform:scale(1.8)}to{color:var(--good);text-shadow:none;transform:none}}

  <div class="stars"></div>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="logo">🌠</span><div>Vocab Meteorite<small id="editionLabel">Master · 10-unit missions</small></div></div><div class="best">MASTER RECORD <b id="bestScore">0</b></div></header>
    <section id="screen" class="screen"></section>
  </main>
  <script>
    const VERSION=document.body.dataset.version;
    const CONFIG=VERSION==='master'?{name:'Master',unitSize:10,accent:'gold'}:{name:'Beginner',unitSize:5,accent:'cyan'};
    const CSV_URLS=Array.from({length:6},(_,i)=>`https://raw.githubusercontent.com/DuCJ-creator/iVocab-Self-Practice/main/level${i+1}.csv`);
    const LETTERS=['A','B','C','D'];
    const screen=document.getElementById('screen');
    const bestKey=`vocabMeteorite${CONFIG.name}Best`;
    document.getElementById('editionLabel').textContent=`${CONFIG.name} · ${CONFIG.unitSize}-unit missions`;
    document.getElementById('bestScore').textContent=localStorage.getItem(bestKey)||0;
    const state={level:1,unitStart:1,count:20,pool:[],queue:[],current:null,options:[],mode:null,score:0,streak:0,bestStreak:0,correct:0,wrong:0,answered:0,lives:6,active:false,paused:false,locked:false,meteor:null,raf:0,roundStart:0,roundDuration:10,review:[],muted:false,activeMeteors:new Map(),lockedId:null,meteorSeq:0,spawnAt:0,pauseStarted:0};
    const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
    const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normalize=s=>String(s||'').trim().toLocaleLowerCase('en-US').replace(/\s+/g,' ');
    function tone(freq=520,d=.08){if(state.muted)return;try{const C=window.AudioContext||window.webkitAudioContext,ctx=window._vmAudio||(window._vmAudio=new C()),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.055,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch{}}
    function speak(text){if(state.muted||!text||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
    function sfxLaser(hit=true){tone(hit?760:410,.055);setTimeout(()=>tone(hit?1120:260,.055),65)}
    function sfxExplosion(heavy=false){tone(heavy?95:145,.2);setTimeout(()=>tone(heavy?70:220,.24),65);setTimeout(()=>tone(heavy?52:110,.28),135)}
    function arenaPoint(el){const arena=document.getElementById('arena'),a=arena.getBoundingClientRect(),r=el.getBoundingClientRect();return{arena,x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2}}
    function addSpark(arena,x,y){const s=document.createElement('div');s.className='hit-spark';s.style.left=x+'px';s.style.top=y+'px';arena.appendChild(s);setTimeout(()=>s.remove(),380)}
    function spawnExplosion(target,small=false){if(!target?.isConnected)return;const{x,y,arena}=arenaPoint(target),boom=document.createElement('div'),ring=document.createElement('div');boom.className='space-explosion';boom.textContent='💥';boom.style.left=x+'px';boom.style.top=y+'px';ring.className='blast-ring';ring.style.left=x+'px';ring.style.top=y+'px';arena.append(boom,ring);for(let i=0;i<(small?5:10);i++){const f=document.createElement('i');f.className='space-fragment';f.style.left=x+'px';f.style.top=y+'px';f.style.setProperty('--fx',(Math.cos(i*2*Math.PI/(small?5:10))*(small?35:75))+'px');f.style.setProperty('--fy',(Math.sin(i*2*Math.PI/(small?5:10))*(small?35:75))+'px');arena.appendChild(f);setTimeout(()=>f.remove(),650)}arena.classList.remove('combat-shake');void arena.offsetWidth;arena.classList.add('combat-shake');setTimeout(()=>{boom.remove();ring.remove();arena.classList.remove('combat-shake')},700);sfxExplosion(false)}
    function fireLaser(target,hit=true,onImpact){if(!target?.isConnected)return;const{x,y,arena}=arenaPoint(target),shot=document.createElement('i'),sx=arena.clientWidth/2,sy=arena.clientHeight-176,missX=hit?x:x+(Math.random()<.5?-1:1)*(80+Math.random()*80),missY=hit?y:Math.max(45,y-55);shot.className='laser-shot'+(hit?'':' miss');shot.style.left=sx+'px';shot.style.top=sy+'px';shot.style.setProperty('--dx',(missX-sx)+'px');shot.style.setProperty('--dy',(missY-sy)+'px');arena.appendChild(shot);sfxLaser(hit);requestAnimationFrame(()=>shot.classList.add('fly'));setTimeout(()=>{shot.remove();if(hit){addSpark(arena,x,y);onImpact?.()}else{const tag=document.createElement('b');tag.className='miss-tag';tag.textContent='MISS';tag.style.left=missX+'px';tag.style.top=missY+'px';arena.appendChild(tag);setTimeout(()=>tag.remove(),700);onImpact?.()}},290)}
    function launchMeteorBarrage(){const arena=document.getElementById('arena'),meteors=[...document.querySelectorAll('.choice-meteor')];arena.classList.add('danger-flash','heavy-shake');meteors.forEach((m,i)=>{m.style.setProperty('--i',i);m.classList.add('barrage');setTimeout(()=>{tone(125-i*13,.2);if(navigator.vibrate)navigator.vibrate(45)},i*90+150)});setTimeout(()=>sfxExplosion(true),280);setTimeout(()=>arena.classList.remove('danger-flash','heavy-shake'),1000)}
    function parseRows(rows,level){return rows.filter(r=>r.Unit&&r.Word&&(r['Chinese Meaning']||r.Meaning)).map((r,i)=>({id:`${level}-${r.Unit}-${i}`,level,unit:+r.Unit,word:String(r.Word).trim(),pos:String(r['Part of Speech']||r.POS||r.Pos||'').trim(),meaning:String(r['Chinese Meaning']||r.Meaning).replace(/;/g,'；').trim()})).filter(w=>w.unit&&w.word&&w.meaning)}
    function loadWords(level){return new Promise(resolve=>{if(typeof Papa==='undefined'){resolve([]);return}Papa.parse(CSV_URLS[level-1],{download:true,header:true,skipEmptyLines:true,complete:r=>resolve(parseRows(r.data,level)),error:()=>resolve([])})})}
    function renderSetup(){stopGame();const ranges=Array.from({length:Math.ceil(50/CONFIG.unitSize)},(_,i)=>i*CONFIG.unitSize+1);screen.innerHTML=`<div class="setup"><section class="hero"><div class="kicker">Magical vocabulary mission</div><h1>Catch the<span>right meteor.</span></h1><p>在星塵落地前辨認、拼寫或聽寫單字。所有英文均保留 CSV 的原始大小寫。</p><div class="features"><div class="feature"><b>1</b><span>選擇 Level 與 ${CONFIG.unitSize} 個連續 Units</span></div><div class="feature"><b>2</b><span>三種模式皆支援滑鼠、鍵盤與觸控</span></div><div class="feature"><b>3</b><span>每次任務結束都有完整成績結算</span></div></div><div class="planet"></div></section><section class="controls"><div class="label">01 · Choose level</div><div class="choices levels">${[1,2,3,4,5,6].map(n=>choice('level',n,`Level ${n}`,state.level===n)).join('')}</div><div class="label">02 · Choose ${CONFIG.unitSize} units</div><div class="choices ranges">${ranges.map(n=>choice('unitStart',n,`Unit ${n}–${Math.min(50,n+CONFIG.unitSize-1)}`,state.unitStart===n)).join('')}</div><div class="label">03 · Mission words</div><div class="choices counts">${[[10,'10'],[20,'20'],[30,'30'],[999,'All']].map(([n,t])=>choice('count',n,t,state.count===n)).join('')}</div><button class="primary" onclick="prepareMission()">Start game →</button></section></div>`}
    function choice(k,v,label,on){return `<button class="choice ${on?'active':''}" onclick="pick('${k}',${v})">${label}</button>`}
    function pick(k,v){state[k]=v;renderSetup()}
    async function prepareMission(){screen.innerHTML='<div class="loading"><div><div class="spinner"></div>正在接收星際單字資料…</div></div>';const all=await loadWords(state.level);if(!all.length){alert('無法載入單字資料。請確認網路連線後再試。');renderSetup();return}const raw=all.filter(w=>w.unit>=state.unitStart&&w.unit<state.unitStart+CONFIG.unitSize);const seen=new Map();raw.forEach(w=>{const k=normalize(w.word)+'|'+w.meaning;if(!seen.has(k))seen.set(k,w)});state.pool=shuffle([...seen.values()]).slice(0,state.count);if(state.pool.length<4){alert('這組 Units 沒有足夠的單字，請選其他範圍。');renderSetup();return}renderModes()}
    function renderModes(){screen.innerHTML=`<div class="mode-screen"><div class="mode-head"><div class="kicker">Level ${state.level} · Unit ${state.unitStart}–${state.unitStart+CONFIG.unitSize-1} · ${state.pool.length} words</div><h2>Choose your flight mode</h2><p>每個模式都會使用同一批單字。準備好後，點選一種模式立即升空。</p></div><div class="mode-grid"><button class="mode-card" onclick="startMode('recognition')"><span class="mode-icon">🎯</span><div><h3>Recognition 認知</h3><p>地面顯示英文＋詞性，點擊四顆中文選項中的正確隕石。</p></div></button><button class="mode-card" onclick="startMode('spelling')"><span class="mode-icon">⌨️</span><div><h3>Spelling 拼寫</h3><p>看中文與詞性，依照 CSV 原始拼法逐字擊落隕石。</p></div></button><button class="mode-card" onclick="startMode('dictation')"><span class="mode-icon">🔊</span><div><h3>Dictation 聽寫</h3><p>聽發音，並使用隕石上的中文提示與詞性完成單字。</p></div></button></div><div class="mode-actions"><button class="secondary" onclick="renderSetup()">← Change setup</button></div></div>`}
    function startMode(mode){Object.assign(state,{mode,queue:shuffle(state.pool),current:null,score:0,streak:0,bestStreak:0,correct:0,wrong:0,answered:0,lives:6,active:true,paused:false,locked:false,review:[],muted:false,activeMeteors:new Map(),lockedId:null,meteorSeq:0,spawnAt:0});renderGameShell();mode==='recognition'?nextRound():startTypingMission()}
    function renderGameShell(){screen.innerHTML=`<div class="game"><header class="hud"><div class="hud-group"><div class="stat score"><span>Score</span><strong id="score">0</strong></div><div class="stat"><span>Streak</span><strong id="streak">×0</strong></div></div><div class="hearts" id="hearts"></div><div class="hud-group"><button id="mute" onclick="toggleMute()" aria-label="Mute">🔊</button><button onclick="togglePause()" aria-label="Pause (costs one shield)">⏸</button><button onclick="finishGame('Mission ended')" aria-label="End game">✕</button></div></header><div class="arena" id="arena"><div class="nebula"></div><div class="banner" id="banner"></div><div class="ground"></div><div id="prompt" class="prompt"></div><div id="typing" class="typing hidden"></div><div id="pause" class="pause hidden"><div><h2>⏸ Mission paused</h2><p>暫停已消耗一個護盾</p><button class="primary" onclick="togglePause()">Resume</button></div></div></div></div>`;updateHUD()}
    function nextRound(){if(!state.active)return;if(!state.queue.length){finishGame('Mission complete');return}state.current=state.queue.shift();state.locked=false;state.answered++;state.roundStart=performance.now();document.querySelectorAll('.meteor').forEach(n=>n.remove());startRecognitionRound();cancelAnimationFrame(state.raf);state.raf=requestAnimationFrame(loop)}
    function buildDistractors(q){const used=new Set([q.meaning]),out=[];for(const w of shuffle(state.pool)){if(used.has(w.meaning))continue;used.add(w.meaning);out.push(w.meaning);if(out.length===3)break}return shuffle([q.meaning,...out])}
    function startRecognitionRound(){state.roundDuration=Math.max(7.5,11.5-(state.answered-1)*.22);state.options=buildDistractors(state.current);const p=document.getElementById('prompt');p.innerHTML=`<div class="prompt-word">${escapeHtml(state.current.word)}</div><div class="prompt-pos">${escapeHtml(state.current.pos||'word')}</div><div class="prompt-hint">點擊正確的中文隕石 · 速度會逐步提升</div>`;document.getElementById('typing').classList.add('hidden');speak(state.current.word);const xs=shuffle([13,37,63,87]).map((x,i)=>Math.max(10,Math.min(90,x+(Math.random()*6-3))));const offsets=shuffle([0,28,58,92]);const items=[];state.options.forEach((o,i)=>{const el=document.createElement('button');el.className=`meteor choice-meteor rock-${i+1}`;el.style.left=xs[i]+'%';el.dataset.meaning=o;el.innerHTML=`<span class="letter">${LETTERS[i]}</span><span>${escapeHtml(o)}</span>`;el.onclick=()=>answerRecognition(el,o);document.getElementById('arena').appendChild(el);items.push({el,offset:offsets[i],correct:o===state.current.meaning})});state.meteor={type:'recognition',progress:0,items}}
    function answerRecognition(el,meaning){if(!state.active||state.paused||state.locked)return;state.locked=true;if(meaning===state.current.meaning){state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);const delta=state.streak*5;state.score+=delta;state.correct++;state.review.push({...state.current,ok:true,answer:meaning});showBanner(`Direct hit! 💥 · +${delta}`);updateHUD();fireLaser(el,true,()=>{spawnExplosion(el);el.classList.add('correct');if(navigator.vibrate)navigator.vibrate(35)});setTimeout(nextRound,900)}else{state.score=Math.max(0,state.score-5);state.lives--;state.wrong++;state.streak=0;state.review.push({...state.current,ok:false,answer:meaning});if(state.lives>0)state.queue.push(state.current);showBanner(state.lives>0?'Wrong! −5 & −1 shield · Returns later':'Wrong! Shields depleted!');updateHUD();launchMeteorBarrage();if(state.lives<=0)setTimeout(()=>finishGame('Out of shields'),1250);else setTimeout(nextRound,1250)}}
    function isLetter(ch){return /[a-z]/i.test(ch)}
    function autoFillNonLetters(data){while(data.typed.length<data.w.word.length&&!isLetter(data.w.word[data.typed.length]))data.typed+=data.w.word[data.typed.length]}
    function typingLimit(){if(state.mode==='dictation')return 1;const done=state.correct+state.wrong;return done<3?1:done<7?2:3}
    function typingDuration(){const done=state.correct+state.wrong,limit=typingLimit();if(limit===1)return Math.max(16.5,19-done*.35);if(limit===2)return Math.max(18,21-(done-3)*.45);return Math.max(21,25-(done-7)*.25)}
    function startTypingMission(){const p=document.getElementById('prompt'),label=state.mode==='dictation'?'Dictation target':'Spelling targets';p.innerHTML=`<div class="target-title">${label} · 中文意思與詞性</div><div class="ground-targets" id="groundTargets"></div>`;const typing=document.getElementById('typing');typing.classList.remove('hidden');typing.innerHTML=`<div class="typing-controls"><div class="typing-display" id="typedDisplay">尚未鎖定隕石</div><button class="pass-btn" type="button" aria-label="Pass current word" onclick="passTypingMeteor()">Pass →</button></div><div class="keyboard" id="keyboard"></div>`;buildKeyboard();renderGroundHints();state.spawnAt=performance.now();spawnTypingMeteor(true);cancelAnimationFrame(state.raf);state.raf=requestAnimationFrame(loop)}
    function renderGroundHints(){if(state.mode==='recognition')return;const box=document.getElementById('groundTargets');if(!box)return;const items=[...state.activeMeteors.values()].sort((a,b)=>b.progress-a.progress);box.innerHTML=items.length?items.map(d=>`<button class="ground-target ${state.lockedId===d.id?'locked':''}" onclick="lockMeteor(${d.id},${state.mode==='dictation'})"><strong>${escapeHtml(d.w.meaning)}</strong><span>${escapeHtml(d.w.pos||'word')}</span></button>`).join(''):'<span class="prompt-hint">正在準備下一顆隕石…</span>'}
    function chooseLane(){const lanes=window.innerWidth<620?[17,50,83]:[18,50,82],used=new Set([...state.activeMeteors.values()].map(d=>d.lane));return lanes.find(x=>!used.has(x))??lanes[Math.floor(Math.random()*lanes.length)]}
    function spawnTypingMeteor(force=false){if(!state.active||state.mode==='recognition'||!state.queue.length||state.activeMeteors.size>=typingLimit())return false;const w=state.queue.shift(),id=++state.meteorSeq,lane=chooseLane(),el=document.createElement('button');el.className=`meteor typing-meteor rock-${id%4+1}`;el.style.left=lane+'%';el.dataset.id=id;el.innerHTML=`${state.mode==='dictation'?'<div class="meteor-audio">🔊 Tap to hear</div>':''}<div class="meaning">${escapeHtml(w.meaning)}</div><div class="pos">${escapeHtml(w.pos||'word')}</div><div class="letters"></div>`;const hintLen=w.word.length?1:0,data={id,w,el,lane,typed:w.word.slice(0,hintLen),hintLen,start:performance.now(),duration:typingDuration(),progress:0,done:false};autoFillNonLetters(data);el.onclick=()=>lockMeteor(id,true);document.getElementById('arena').appendChild(el);state.activeMeteors.set(id,data);renderMeteorLetters(data);renderGroundHints();if(state.mode==='dictation')speak(w.word);state.spawnAt=performance.now()+1200;return true}
    function lockMeteor(id,playAudio=false){const data=state.activeMeteors.get(id);if(!data||data.done)return;state.activeMeteors.forEach(d=>d.el.classList.remove('locked'));state.lockedId=id;data.el.classList.add('locked');if(playAudio&&state.mode==='dictation')speak(data.w.word);renderTyped(data);renderGroundHints()}
    function lettersHtml(data){let html='';for(let i=0;i<data.w.word.length;i++)html+=i<data.typed.length?`<span class="${i<data.hintLen?'hint':'done'}${i===data.lastHitIndex?' just-hit':''}">${escapeHtml(data.w.word[i])}</span>`:'_';return html}
    function renderMeteorLetters(data){const el=data.el.querySelector('.letters');if(el)el.innerHTML=lettersHtml(data)}
    function renderTyped(data=state.activeMeteors.get(state.lockedId)){const td=document.getElementById('typedDisplay');if(!td)return;td.innerHTML=data?lettersHtml(data):'尚未鎖定隕石 · Click or type a first letter'}
    function buildKeyboard(){const kb=document.getElementById('keyboard');['qwertyuiop','asdfghjkl','zxcvbnm'].forEach(row=>{const r=document.createElement('div');r.className='keyrow';[...row].forEach(ch=>{const b=document.createElement('button');b.className='key';b.type='button';b.dataset.key=ch;b.textContent=ch.toUpperCase();b.onclick=()=>handleLetter(ch);r.appendChild(b)});kb.appendChild(r)})}
    function handleLetter(ch){if(!state.active||state.paused||state.mode==='recognition')return;let data=state.activeMeteors.get(state.lockedId);if(!data){const matches=[...state.activeMeteors.values()].filter(d=>d.w.word[d.typed.length]?.toLowerCase()===ch.toLowerCase()).sort((a,b)=>b.progress-a.progress);data=matches[0];if(data)lockMeteor(data.id,false)}if(!data||data.typed.length>=data.w.word.length)return;const expected=data.w.word[data.typed.length];if(expected?.toLowerCase()===ch.toLowerCase()){const hitIndex=data.typed.length;data.typed+=expected;autoFillNonLetters(data);const complete=data.typed.length>=data.w.word.length;fireLaser(data.el,true,()=>{if(data.done)return;data.lastHitIndex=hitIndex;renderMeteorLetters(data);renderTyped(data);data.el.classList.remove('letter-impact');void data.el.offsetWidth;data.el.classList.add('letter-impact');setTimeout(()=>data.el?.classList.remove('letter-impact'),240);if(complete)solveTyping(data)});tone(520,.04)}else{fireLaser(data.el,false,()=>{if(data.done)return;data.el.classList.remove('miss-recoil');void data.el.offsetWidth;data.el.classList.add('miss-recoil');setTimeout(()=>data.el?.classList.remove('miss-recoil'),320)});tone(135,.08)}}
    function solveTyping(data){if(data.done||!state.active)return;data.done=true;state.activeMeteors.delete(data.id);if(state.lockedId===data.id){state.lockedId=null;renderTyped()}renderGroundHints();state.answered++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);const delta=10+Math.min(state.streak,10)*2;state.score+=delta;state.correct++;state.review.push({...data.w,ok:true,answer:data.typed});spawnExplosion(data.el,true);data.el.classList.add('final-blast');setTimeout(()=>data.el.remove(),580);showBanner(`Meteor destroyed! 💥 · +${delta}`);updateHUD();state.spawnAt=performance.now()+420;checkTypingEnd()}
    function loop(now){if(!state.active)return;if(state.paused){state.raf=requestAnimationFrame(loop);return}const arena=document.getElementById('arena');if(!arena)return;const end=arena.clientHeight-185;if(state.mode==='recognition'){const progress=Math.min(1,(now-state.roundStart)/1000/state.roundDuration);state.meteor.progress=progress;state.meteor.items.forEach(item=>{if(!item.el.classList.contains('correct'))item.el.style.top=(-135+progress*(end+135)+item.offset*(1-progress))+'px'});if(progress>=1&&!state.locked){missRecognition();return}}else{if(now>=state.spawnAt)spawnTypingMeteor();[...state.activeMeteors.values()].forEach(data=>{data.progress=Math.min(1,(now-data.start)/1000/data.duration);data.el.style.top=(-100+data.progress*(end+95))+'px';if(data.progress>=1)missTypingMeteor(data)});if(state.activeMeteors.size<typingLimit()&&state.queue.length&&now>=state.spawnAt)spawnTypingMeteor()}state.raf=requestAnimationFrame(loop)}
    function missRecognition(){if(state.locked)return;state.locked=true;state.lives--;state.wrong++;state.streak=0;state.score=Math.max(0,state.score-5);state.review.push({...state.current,ok:false,answer:''});if(state.lives>0)state.queue.push(state.current);showBanner(state.lives>0?'Meteor landed · −5 & −1 shield · Returns later':'Meteor landed · Shields depleted');tone(110,.18);updateHUD();if(state.lives<=0)setTimeout(()=>finishGame('Out of shields'),500);else setTimeout(nextRound,550)}
    function missTypingMeteor(data){if(data.done||!state.active)return;data.done=true;state.activeMeteors.delete(data.id);data.el.remove();if(state.lockedId===data.id){state.lockedId=null;renderTyped()}renderGroundHints();state.answered++;state.lives--;state.wrong++;state.streak=0;state.score=Math.max(0,state.score-5);state.review.push({...data.w,ok:false,answer:data.typed});if(state.lives>0)state.queue.push(data.w);showBanner(state.lives>0?'Meteor landed · −5 & −1 shield · Returns later':'Meteor landed · Shields depleted');tone(110,.18);updateHUD();state.spawnAt=performance.now()+350;if(state.lives<=0){finishGame('Out of shields');return}checkTypingEnd()}
    function passTypingMeteor(){if(!state.active||state.paused||state.mode==='recognition')return;let data=state.activeMeteors.get(state.lockedId);if(!data)data=[...state.activeMeteors.values()].sort((a,b)=>b.progress-a.progress)[0];if(!data||data.done)return;data.done=true;state.activeMeteors.delete(data.id);data.el.remove();if(state.lockedId===data.id)state.lockedId=null;renderTyped();renderGroundHints();state.answered++;state.wrong++;state.streak=0;state.review.push({...data.w,ok:false,answer:'PASS'});state.queue.push(data.w);showBanner('Passed · Returns later · no shield cost');tone(220,.08);updateHUD();state.spawnAt=performance.now()+250;checkTypingEnd()}
    function checkTypingEnd(){if(state.active&&state.mode!=='recognition'&&!state.queue.length&&!state.activeMeteors.size)setTimeout(()=>finishGame('Mission complete'),450)}
    function showBanner(text){const b=document.getElementById('banner');if(!b)return;b.textContent=text;b.classList.add('show');setTimeout(()=>b?.classList.remove('show'),900)}
    function updateHUD(){const s=document.getElementById('score'),st=document.getElementById('streak'),h=document.getElementById('hearts');if(s)s.textContent=state.score;if(st)st.textContent='×'+state.streak;if(h)h.textContent='💙'.repeat(Math.max(0,state.lives))+'🖤'.repeat(Math.max(0,6-state.lives))}
    function toggleMute(){state.muted=!state.muted;document.getElementById('mute').textContent=state.muted?'🔇':'🔊';if(state.muted&&'speechSynthesis'in window)speechSynthesis.cancel()}
    function togglePause(){if(!state.active)return;if(!state.paused){state.lives--;state.paused=true;state.pauseStarted=performance.now();updateHUD();document.getElementById('pause')?.classList.remove('hidden');if(state.lives<=0){finishGame('Pause cost the last shield');return}}else{const pausedFor=performance.now()-state.pauseStarted;state.paused=false;document.getElementById('pause')?.classList.add('hidden');if(state.mode==='recognition')state.roundStart+=pausedFor;else{state.activeMeteors.forEach(d=>d.start+=pausedFor);state.spawnAt+=pausedFor}}}
    function stopGame(){state.active=false;cancelAnimationFrame(state.raf);state.activeMeteors.forEach(d=>d.el?.remove());state.activeMeteors.clear();if('speechSynthesis'in window)speechSynthesis.cancel()}
    function finishGame(reason){if(!state.active)return;stopGame();const accuracy=state.answered?Math.round(state.correct/state.answered*100):0;const best=Math.max(state.score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best);document.getElementById('bestScore').textContent=best;const reviewed=new Map(state.review.map(r=>[r.id,r]));const rows=state.pool.map(w=>{const r=reviewed.get(w.id);return `<div class="word-row"><span>${r?.ok?'✅':r?'❌':'➖'}</span><span class="w">${escapeHtml(w.word)}</span><span class="p">${escapeHtml(w.pos)}</span><span class="m">${escapeHtml(w.meaning)}</span></div>`}).join('');screen.innerHTML=`<div class="results-screen"><div class="results-head"><div class="trophy">${state.lives>0?'🏆':'🛰️'}</div><div class="kicker">${escapeHtml(reason)}</div><h2>Mission summary</h2><p>${CONFIG.name} · ${state.mode} · Level ${state.level} · Unit ${state.unitStart}–${state.unitStart+CONFIG.unitSize-1}</p></div><div class="result-grid"><div class="result-card"><strong>${state.score}</strong><span>Score</span></div><div class="result-card"><strong>${state.correct}</strong><span>Correct</span></div><div class="result-card"><strong>${state.wrong}</strong><span>Wrong</span></div><div class="result-card"><strong>${accuracy}%</strong><span>Accuracy</span></div><div class="result-card"><strong>×${state.bestStreak}</strong><span>Best streak</span></div></div><div class="word-review">${rows}</div><div class="result-actions"><button class="secondary" onclick="renderSetup()">Change setup</button><button class="primary" onclick="startMode(state.mode)">Play again</button></div></div>`}
    document.addEventListener('keydown',e=>{if(!state.active)return;if(e.key==='Escape'){togglePause();return}if(state.paused)return;if(state.mode==='recognition'){if(state.locked)return;const i=LETTERS.indexOf(e.key.toUpperCase());if(i>=0){const meteor=[...document.querySelectorAll('.choice-meteor')][i];meteor?.click()}}else if(/^[a-zA-Z]$/.test(e.key))handleLetter(e.key.toLowerCase())});
    renderSetup();
  </script>
</body>
</html>
