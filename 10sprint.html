
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vocab Sprint｜限時單字挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--ink:#172c3d;--muted:#687d8d;--paper:#f4f8f7;--card:#fff;--line:#dce7e4;--mint:#1fa58f;--mint2:#def5ef;--blue:#397ba6;--blue2:#e6f1f7;--amber:#f4ad3d;--rose:#e46761;--shadow:0 20px 60px rgba(23,44,61,.11)}*{box-sizing:border-box;margin:0;padding:0}button{font:inherit}body{min-height:100dvh;background:linear-gradient(rgba(31,165,143,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(31,165,143,.045) 1px,transparent 1px),radial-gradient(circle at 8% 0,rgba(31,165,143,.16),transparent 28%),radial-gradient(circle at 96% 92%,rgba(244,173,61,.15),transparent 30%),var(--paper);background-size:28px 28px,28px 28px,auto,auto,auto;font-family:'DM Sans','Noto Sans TC',sans-serif;color:var(--ink);padding:16px;user-select:none}.shell{width:min(1100px,100%);min-height:calc(100dvh - 32px);margin:auto;display:flex;flex-direction:column}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.78rem;box-shadow:inset 0 -3px rgba(255,255,255,.12)}.brand small{display:block;font-size:.62rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}.best{font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.7)}.best strong{color:var(--mint);font-size:.82rem;margin-left:6px}.panel{flex:1;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-height:640px}
.setup{display:grid;grid-template-columns:1fr 1fr;min-height:640px}.hero{background:linear-gradient(145deg,#172c3d,#214d5b);color:#fff;padding:60px 54px;position:relative;overflow:hidden}.hero:after{content:'10';position:absolute;right:-30px;bottom:-80px;font-size:300px;line-height:1;font-weight:800;color:rgba(255,255,255,.035);letter-spacing:-.1em}.eyebrow{display:flex;align-items:center;gap:9px;color:#9ce2d5;font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.eyebrow:before{content:'';width:25px;height:2px;background:var(--amber)}h1{font-size:clamp(43px,6vw,68px);line-height:.96;letter-spacing:-.06em;margin:24px 0 20px}.hero h1 span{display:block;color:#66d2be}.hero p{color:#c7d7dc;line-height:1.75;max-width:430px;font-size:.93rem}.features{margin-top:38px;display:grid;gap:11px}.feature{display:flex;gap:11px;align-items:center;color:#d9e6e9;font-size:.8rem}.feature b{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.1);color:#8ce1d0}.setup-form{padding:46px;display:flex;flex-direction:column;justify-content:center}.label{font-size:.66rem;color:var(--muted);font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin:20px 0 9px}.label:first-child{margin-top:0}.choices{display:grid;gap:8px}.levels{grid-template-columns:repeat(3,1fr)}.ranges{grid-template-columns:repeat(2,1fr)}.times{grid-template-columns:repeat(4,1fr)}.choice{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:11px 8px;cursor:pointer;font-weight:700;font-size:.82rem;transition:.18s}.choice:hover{border-color:var(--mint);transform:translateY(-1px)}.choice.active{background:var(--mint2);border-color:var(--mint);color:#147766;box-shadow:inset 0 0 0 1px var(--mint)}.start{margin-top:24px;border:0;border-radius:13px;padding:15px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer;transition:.2s}.start:hover{background:#214d5b;transform:translateY(-1px);box-shadow:0 10px 22px rgba(23,44,61,.18)}
.loading{min-height:640px;display:grid;place-items:center;text-align:center;color:var(--muted)}.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
.game{min-height:640px;display:grid;grid-template-rows:auto 1fr}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line);background:#fbfdfc}.hud-side{display:flex;align-items:center;gap:10px}.hud-side.right{justify-content:flex-end}.stat{padding:7px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;min-width:76px}.stat span{display:block;font-size:.55rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.stat strong{font-size:1.08rem}.score-stat{background:var(--ink);border-color:var(--ink);color:#fff;position:relative;min-width:92px}.score-stat span{color:#a8bbc6}.score-stat strong{color:#76dbc8}.score-delta{position:absolute;right:9px;bottom:8px;font-size:.7rem!important;font-style:normal;font-weight:800;color:#76dbc8;animation:scoreTick .38s ease}.score-delta.loss{color:#ffaaa5}@keyframes scoreTick{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.round-time{text-align:center}.round-time span{display:block;font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.round-time strong{font-size:1.25rem}.exit{border:1px solid var(--line);background:#fff;color:var(--rose);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:.72rem;font-weight:800}
.arena{padding:22px;display:grid;grid-template-columns:1fr 230px;gap:18px;background:linear-gradient(145deg,#f7faf9,#edf5f3)}.question-card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:27px;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}.question-top{display:flex;justify-content:space-between;align-items:center;gap:14px}.qmeta{font-size:.65rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:800}.audio{border:1px solid #c8dde8;background:var(--blue2);color:var(--blue);border-radius:999px;padding:8px 12px;cursor:pointer;font-size:.72rem;font-weight:800}.word{text-align:center;margin:24px 0 20px}.word h2{font-size:clamp(34px,6vw,58px);letter-spacing:-.045em;line-height:1.05;overflow-wrap:anywhere}.pos{display:inline-block;margin-top:9px;padding:5px 10px;border-radius:999px;background:#f0f4f5;color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}.option{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;text-align:left;color:var(--ink);cursor:pointer;display:flex;align-items:flex-start;gap:11px;line-height:1.4;font-size:.84rem;font-weight:600;transition:.16s;min-height:70px}.option b{flex:0 0 25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#edf3f4;color:var(--muted);font-size:.68rem}.option:hover{border-color:var(--mint);transform:translateY(-1px);box-shadow:0 7px 15px rgba(23,44,61,.07)}.option.correct{background:var(--mint2);border-color:var(--mint);color:#126f60}.option.correct b{background:var(--mint);color:#fff}.option.wrong{background:#fff0ef;border-color:var(--rose);color:#a8423e}.option.wrong b{background:var(--rose);color:#fff}.option:disabled{cursor:default;transform:none}
.side{display:flex;flex-direction:column;gap:12px}.clock{aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--mint) var(--progress),#e5eeec 0);padding:10px;margin:0 auto;width:min(100%,172px);transition:background .15s linear}.clock.warn{background:conic-gradient(var(--amber) var(--progress),#f4ead8 0)}.clock.danger{background:conic-gradient(var(--rose) var(--progress),#f5dfdd 0);animation:pulse .6s infinite}@keyframes pulse{50%{transform:scale(.97)}}.clock-inner{height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}.clock-inner span{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.clock-inner strong{display:block;font-size:2.6rem;line-height:1}.streak-card{background:var(--ink);color:#fff;border-radius:16px;padding:16px}.streak-card span{font-size:.6rem;color:#a8bac5;text-transform:uppercase;letter-spacing:.11em}.streak-card strong{display:block;font-size:1.7rem;color:#74dbc7;margin-top:3px}.next-score{font-size:.7rem;color:#bfd0d7;margin-top:6px}.pool-card{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px;font-size:.72rem;color:var(--muted);line-height:1.6}.pool-card b{color:var(--ink)}.feedback{position:absolute;inset:0;background:rgba(255,255,255,.88);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:5;animation:fade .15s}.feedback-box{text-align:center}.feedback-icon{font-size:3.2rem}.feedback-box strong{display:block;font-size:1.2rem;margin-top:6px}.feedback-box span{font-size:.75rem;color:var(--muted)}@keyframes fade{from{opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(23,44,61,.58);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(460px,100%);background:#fff;border-radius:22px;padding:32px;text-align:center;box-shadow:var(--shadow)}.modal .tag{font-size:.66rem;color:var(--mint);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.modal h2{font-size:2rem;letter-spacing:-.04em;margin:10px 0 6px}.modal p{color:var(--muted);font-size:.85rem}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:23px 0}.result{background:#f2f7f6;border-radius:12px;padding:12px 6px}.result strong{display:block;font-size:1.25rem}.result span{font-size:.58rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}.secondary{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:12px;cursor:pointer;font-weight:700}
@media(max-width:790px){body{padding:9px}.shell{min-height:calc(100dvh - 18px)}.panel{min-height:calc(100dvh - 72px);border-radius:18px}.setup{grid-template-columns:1fr;min-height:0}.hero{padding:30px 25px}.hero h1{font-size:45px;margin:16px 0 12px}.hero p{font-size:.82rem}.features{display:none}.setup-form{padding:25px 20px}.arena{grid-template-columns:1fr;padding:10px;gap:10px}.question-card{padding:18px;min-height:490px}.side{display:grid;grid-template-columns:120px 1fr;align-items:center}.clock{width:116px}.clock-inner strong{font-size:2rem}.pool-card{display:none}.options{grid-template-columns:1fr;gap:7px}.option{min-height:58px;padding:11px}.word{margin:18px 0 14px}.hud{grid-template-columns:1fr auto;padding:9px}.round-time{display:none}.hud-side.right{display:none}.game{min-height:0}.brand small{display:none}.best{font-size:.58rem}.times{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.levels{grid-template-columns:repeat(3,1fr)}.ranges{grid-template-columns:1fr}.options{grid-template-columns:1fr}.question-card{min-height:500px}.results{grid-template-columns:1fr 1fr}.result:last-child{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main class="shell"><header class="topbar"><div class="brand"><span class="mark">VS</span><div>Vocab Sprint<small>Timed meaning challenge</small></div></div><div class="best">PERSONAL BEST <strong id="bestScore">0</strong></div></header><section id="app" class="panel"></section></main>
<script>
const CSV_URLS=Array.from({length:6},(_,i)=>`https://raw.githubusercontent.com/DuCJ-creator/iVocab-Self-Practice/main/level${i+1}.csv`),LETTERS=['A','B','C','D'];
const state={level:1,unitStart:1,duration:180,pool:[],order:[],cursor:0,cycle:1,lastId:null,current:null,options:[],score:0,streak:0,bestStreak:0,correct:0,wrong:0,answered:0,gameLeft:180,qLeft:10,gameTimer:null,qTimer:null,active:false,locked:false,feedback:null};
const app=document.getElementById('app');document.getElementById('bestScore').textContent=localStorage.getItem('vocabSprintBest')||0;
const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tone(freq=520,d=.08){try{const C=window.AudioContext||window.webkitAudioContext,ctx=window._vsAudio||(window._vsAudio=new C()),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.055,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function speak(text){if(!text||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function loadWords(level){return new Promise(resolve=>Papa.parse(CSV_URLS[level-1],{download:true,header:true,complete:res=>resolve(res.data.filter(r=>r.Level&&r.Unit&&r.Word&&(r['Chinese Meaning']||r.Meaning)).map((r,i)=>({id:`${level}-${r.Unit}-${i}`,unit:+r.Unit,word:r.Word.trim(),meaning:(r['Chinese Meaning']||r.Meaning).replace(/;/g,'；').trim(),pos:(r['Part of Speech']||r.POS||r.Pos||'').trim()}))),error:()=>resolve([])}))}
function renderSetup(){stopTimers();state.active=false;app.innerHTML=`<div class="setup"><section class="hero"><div class="eyebrow">10-second challenge</div><h1>Think fast.<span>Stay sharp.</span></h1><p>聽發音、看單字與詞性，在每題 10 秒內選出唯一正確的中文意思。答對連勝越長，單題得分越高。</p><div class="features"><div class="feature"><b>1</b><span>每輪題目不重複，題庫用完才重新洗牌</span></div><div class="feature"><b>2</b><span>連勝加分：+5、+10、+15、+20…</span></div><div class="feature"><b>3</b><span>答錯或超時扣 5 分，並中斷連勝</span></div></div></section><section class="setup-form"><div class="label">01 · Choose level</div><div class="choices levels">${[1,2,3,4,5,6].map(n=>`<button class="choice ${state.level===n?'active':''}" onclick="pick('level',${n})">Level ${n}</button>`).join('')}</div><div class="label">02 · Choose unit range</div><div class="choices ranges">${[1,11,21,31,41].map(n=>`<button class="choice ${state.unitStart===n?'active':''}" onclick="pick('unitStart',${n})">Unit ${n}–${n+9}</button>`).join('')}</div><div class="label">03 · Challenge time</div><div class="choices times">${[[180,'3m'],[300,'5m'],[600,'10m'],[900,'15m']].map(([n,t])=>`<button class="choice ${state.duration===n?'active':''}" onclick="pick('duration',${n})">${t}</button>`).join('')}</div><button class="start" onclick="startGame()">Start challenge →</button></section></div>`}
function pick(k,v){state[k]=v;renderSetup()}
async function startGame(){app.innerHTML='<div class="loading"><div><div class="spinner"></div>正在建立挑戰題庫…</div></div>';const all=await loadWords(state.level),raw=all.filter(w=>w.unit>=state.unitStart&&w.unit<state.unitStart+10);const seen=new Map();for(const w of raw){const k=w.word.toLowerCase()+'|'+w.meaning;if(!seen.has(k))seen.set(k,w)}state.pool=[...seen.values()];const uniqueMeanings=new Set(state.pool.map(w=>w.meaning));if(state.pool.length<4||uniqueMeanings.size<4){alert('這個範圍沒有足夠的不同選項，請選其他單元。');renderSetup();return}Object.assign(state,{order:[],cursor:0,cycle:1,lastId:null,current:null,score:0,streak:0,bestStreak:0,correct:0,wrong:0,answered:0,gameLeft:state.duration,qLeft:10,active:true,locked:false,feedback:null});refillOrder();nextQuestion();startGameTimer()}
function refillOrder(){state.order=shuffle(state.pool);if(state.lastId&&state.order[0]?.id===state.lastId&&state.order.length>1)[state.order[0],state.order[1]]=[state.order[1],state.order[0]];state.cursor=0}
function takeQuestion(){if(state.cursor>=state.order.length){state.cycle++;refillOrder()}const q=state.order[state.cursor++];state.lastId=q.id;return q}
function buildOptions(q){const used=new Set([q.meaning]);const distractors=[];for(const w of shuffle(state.pool)){if(w.id===q.id||used.has(w.meaning))continue;used.add(w.meaning);distractors.push(w.meaning);if(distractors.length===3)break}return shuffle([q.meaning,...distractors])}
function nextQuestion(){if(!state.active)return;clearInterval(state.qTimer);state.current=takeQuestion();state.options=buildOptions(state.current);state.qLeft=10;state.locked=false;state.feedback=null;renderGame();speak(state.current.word);state.qTimer=setInterval(()=>{if(!state.active||state.locked)return;state.qLeft--;if(state.qLeft<=0)handleTimeout();else renderGame()},1000)}
function renderGame(){const q=state.current;if(!q)return;app.innerHTML=`<div class="game"><header class="hud"><div class="hud-side"><div class="stat score-stat"><span>Score</span><strong>${state.score}</strong>${state.feedback?`<em class="score-delta ${state.feedback.ok?'':'loss'}">${state.feedback.delta>0?'+':''}${state.feedback.delta}</em>`:''}</div><div class="stat"><span>Streak</span><strong>×${state.streak}</strong></div></div><div class="round-time"><span>Challenge time</span><strong>${formatTime(state.gameLeft)}</strong></div><div class="hud-side right"><div class="stat"><span>Question</span><strong>${state.answered+1}</strong></div><button class="exit" onclick="finish('挑戰結束')">End</button></div></header><div class="arena"><section class="question-card"><div class="question-top"><div class="qmeta">Level ${state.level} · Unit ${state.unitStart}–${state.unitStart+9} · Round ${state.cycle}</div><button class="audio" onclick="speak(state.current.word)">🔊 Hear word</button></div><div class="word"><h2>${q.word}</h2><span class="pos">${q.pos||'word'}</span></div><div class="options">${state.options.map((o,i)=>`<button class="option ${state.feedback?.correct===o?'correct':''} ${state.feedback?.chosen===o&&!state.feedback.ok?'wrong':''}" ${state.locked?'disabled':''} onclick="answer(${i})"><b>${LETTERS[i]}</b><span>${o}</span></button>`).join('')}</div></section><aside class="side"><div class="clock ${state.qLeft<=3?'danger':state.qLeft<=5?'warn':''}" style="--progress:${state.qLeft*10}%"><div class="clock-inner"><div><span>Seconds</span><strong>${state.qLeft}</strong></div></div></div><div class="streak-card"><span>Current streak</span><strong>× ${state.streak}</strong><div class="next-score">Next correct answer: +${(state.streak+1)*5}</div></div><div class="pool-card"><b>${state.pool.length} words in this pool</b><br>${state.cursor} / ${state.order.length} used in current round<br>No repeats until the pool resets.</div></aside></div></div>`}
async function answer(i){if(!state.active||state.locked)return;state.locked=true;clearInterval(state.qTimer);const chosen=state.options[i],ok=chosen===state.current.meaning;state.answered++;if(ok){state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);state.correct++;const delta=state.streak*5;state.score+=delta;state.feedback={ok:true,chosen,correct:state.current.meaning,delta};tone(620+Math.min(state.streak,8)*35,.1)}else{state.wrong++;state.streak=0;state.score=Math.max(0,state.score-5);state.feedback={ok:false,chosen,correct:state.current.meaning,delta:-5};tone(180,.14)}renderGame();await sleep(420);if(!state.active)return;if(state.score===0&&!ok){finish('分數歸零');return}nextQuestion()}
async function handleTimeout(){if(state.locked||!state.active)return;state.locked=true;clearInterval(state.qTimer);state.answered++;state.wrong++;state.streak=0;state.score=Math.max(0,state.score-5);state.feedback={ok:false,timeout:true,chosen:null,correct:state.current.meaning,delta:-5};tone(120,.18);renderGame();await sleep(420);if(!state.active)return;if(state.score===0){finish('分數歸零');return}nextQuestion()}
function startGameTimer(){clearInterval(state.gameTimer);state.gameTimer=setInterval(()=>{if(!state.active)return;state.gameLeft--;if(state.gameLeft<=0)finish('時間到');else renderGame()},1000)}
function stopTimers(){clearInterval(state.gameTimer);clearInterval(state.qTimer);state.gameTimer=state.qTimer=null}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function finish(reason){if(!state.active)return;state.active=false;stopTimers();if('speechSynthesis'in window)speechSynthesis.cancel();const accuracy=state.answered?Math.round(state.correct/state.answered*100):0,best=Math.max(state.score,+(localStorage.getItem('vocabSprintBest')||0));localStorage.setItem('vocabSprintBest',best);document.getElementById('bestScore').textContent=best;app.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="modal"><div class="tag">Challenge complete</div><h2>${reason}</h2><p>完成這次限時衝刺，看看你的成果。</p><div class="results"><div class="result"><strong>${state.score}</strong><span>Score</span></div><div class="result"><strong>${accuracy}%</strong><span>Accuracy</span></div><div class="result"><strong>×${state.bestStreak}</strong><span>Best streak</span></div></div><div class="modal-actions"><button class="secondary" onclick="renderSetup()">Change setup</button><button class="start" style="margin:0" onclick="startGame()">Play again</button></div></div></div>`)}
document.addEventListener('keydown',e=>{if(!state.active||state.locked)return;const k=e.key.toUpperCase(),i=['1','2','3','4'].indexOf(k)>=0?+k-1:LETTERS.indexOf(k);if(i>=0&&i<4)answer(i)});renderSetup();
</script></body></html>
