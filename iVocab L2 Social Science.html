<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iVocab Level 2 Social Science · iVocab L2 社會科學課程 · Science Courseware</title>
  <style>
    :root{
      --ink:#514631; --muted:#6B705F; --line:#C9D2C4;
      --bg:#F3F6F0; --paper:#FFFDFC;
      --c-coral:#987338; --c-butter:#C8A65F; --c-mint:#89AA7A;
      --c-sky:#4E89AF;   --c-lilac:#514631;  --c-rose:#C8A65F;
      --shadow:0 2px 0 rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    /* Put a CJK font BEFORE Helvetica/Segoe so all Chinese characters use
       the same face — otherwise the OS picks different fallbacks per
       character and weights look uneven. */
    body{
      font-family:-apple-system,BlinkMacSystemFont,
                  "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",
                  "Helvetica Neue","Segoe UI",sans-serif;
      color:var(--ink); background:var(--bg);
      line-height:1.6; min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }
    /* Lock the Chinese text to one font so every character has identical
       weight/spacing. */
    .zh, .zh-block, .zh-cell,
    .panel-intro .zh-block,
    .card-head .titles .zh,
    .topbar h1 .zh,
    .panel-header h2 .zh,
    .hero .zh{
      font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
                  "Noto Sans CJK SC","Heiti SC",sans-serif;
      font-weight:400;
    }
    .zh strong, .zh-block strong{ font-weight:600 }
    a{color:#2563EB}
    button{font-family:inherit; cursor:pointer}

    /* ---------- top bar ---------- */
    .topbar{
      position:sticky; top:0; z-index:50;
      background:var(--paper);
      border-bottom:2px solid var(--line);
      padding:12px 22px;
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    }
    .topbar h1{
      margin:0; font-size:22px; line-height:1.2;
    }
    .topbar h1 .zh{
      color:var(--muted); font-weight:400; font-size:14px; margin-left:6px;
    }
    .topbar .flex-spacer{flex:1}
    .toolbtn{
      border:2px solid var(--ink); background:var(--paper); color:var(--ink);
      padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600;
      transition:transform .08s;
    }
    .toolbtn:hover{transform:translateY(-1px); background:#FFF6E5}
    .toolbtn.active{background:var(--ink); color:white}

    /* ---------- tabs ---------- */
    .tabs{
      display:flex; gap:5px; padding:14px 22px 0; flex-wrap:nowrap; overflow-x:auto;
      max-width:1100px; margin:0 auto;
    }
    .tab{
      border:2px solid var(--ink); background:var(--paper); color:var(--ink);
      padding:8px 16px; border-radius:14px 14px 0 0; font-size:14px; font-weight:600;
      border-bottom:none; position:relative;
    }
    .tab.active{background:var(--ink); color:white}
    .tab .tab-actions{
      display:none; margin-left:8px;
    }
    .edit-mode .tab .tab-actions{display:inline-flex; gap:4px}
    .tab .tab-actions .mini{
      border:1px solid currentColor; background:transparent; color:inherit;
      width:20px; height:20px; border-radius:50%; padding:0;
      font-size:11px; line-height:1;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .tab-add{
      border:2px dashed var(--muted); background:transparent; color:var(--muted);
      padding:8px 14px; border-radius:14px 14px 0 0; font-size:14px;
      display:none;
    }
    .edit-mode .tab-add{display:inline-block}

    /* ---------- main ---------- */
    main{
      max-width:1100px; margin:0 auto; padding:0 22px 60px;
    }
    .panel{
      background:var(--paper);
      border:2px solid var(--ink);
      border-radius:0 18px 18px 18px;
      padding:22px;
      box-shadow:var(--shadow);
      min-height:60vh;
    }
    .panel-header{
      display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px;
    }
    .panel-header h2{
      margin:0; font-size:24px; font-weight:800; line-height:1.2;
    }
    .panel-header h2 .zh{font-size:18px; color:var(--muted); font-weight:500; margin-left:8px}
    .panel-header .panel-actions{
      margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;
    }
    .panel-header .panel-actions .toolbtn{
      font-size:12px; padding:5px 10px;
    }
    .panel-intro{
      font-size:15px; color:#333;
      background:#FFFAEC; border:1.5px dashed var(--ink); border-radius:14px;
      padding:14px 18px; margin-bottom:14px;
    }
    .panel-intro .zh-block{
      margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
    }

    /* ---------- card grid ---------- */
    .card-grid{
      display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:18px;
    }
    .card{
      border:2px solid var(--ink);
      border-radius:18px;
      background:var(--paper);
      overflow:visible;
      min-width:0;
      box-shadow:var(--shadow);
      display:flex; flex-direction:column;
      position:relative;
    }
    .card-head{
      padding:10px 14px;
      border-bottom:2px solid var(--ink);
      border-radius:16px 16px 0 0;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .card-head .emoji{font-size:22px; min-width:1.2em}
    .card-head .titles{flex:1; min-width:0}
    .card-head .titles .en{font-weight:800; font-size:16px; line-height:1.25}
    .card-head .titles .zh{color:var(--ink); font-size:13px; opacity:.75; line-height:1.25}
    .card-body{padding:14px 16px; font-size:15px; min-width:0}
    .card-body img{
      display:block;
      width:100%;
      max-width:100%;
      height:auto;
      margin:12px auto;
    }
    .card-body .zh-block{
      margin-top:10px; padding-top:10px;
      border-top:1px dashed var(--line);
    }
    .card-body p{margin:0 0 8px}
    .card-body ul, .card-body ol{margin:6px 0 8px 22px; padding:0}
    .card-body li{margin:0 0 4px}
    .card-body blockquote{
      margin:8px 0; padding:8px 12px;
      border-left:4px solid var(--ink);
      background:#FFFAEC;
      font-style:italic; border-radius:6px;
    }

    /* card colors (header backgrounds) */
    .card.coral .card-head{background:var(--c-coral)}
    .card.butter .card-head{background:var(--c-butter)}
    .card.mint .card-head{background:var(--c-mint)}
    .card.sky .card-head{background:var(--c-sky)}
    .card.lilac .card-head{background:var(--c-lilac)}
    .card.rose .card-head{background:var(--c-rose)}

    /* ---------- copy-to-retell button (always visible) ---------- */
    .copy-to-retell{
      border:1.5px solid var(--ink); background:var(--paper); color:var(--ink);
      font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px;
      display:inline-flex; align-items:center; gap:4px; line-height:1;
      white-space:nowrap;
    }
    .copy-to-retell:hover{background:#FFF6E5}
    .copy-to-retell.copied{background:var(--c-mint); border-color:#0F766E}

    /* ---------- toast ---------- */
    .toast{
      position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
      background:var(--ink); color:white; padding:10px 18px;
      border-radius:999px; font-weight:600; font-size:14px;
      box-shadow:var(--shadow); z-index:300;
      opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

    /* ---------- card actions (only in edit mode) ---------- */
    .card-actions{display:none; gap:6px; margin-left:6px; flex-wrap:wrap}
    .edit-mode .card-actions{display:flex}
    .icon-btn{
      width:30px; height:30px; border-radius:50%;
      border:1.5px solid var(--ink); background:var(--paper);
      font-size:14px; line-height:1;
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }
    .icon-btn:hover{background:#FFF6E5}
    .icon-btn.danger{border-color:#B00020; color:#B00020}
    .add-card{
      border:2px dashed var(--muted); border-radius:18px; min-height:120px;
      display:none; align-items:center; justify-content:center; color:var(--muted);
      background:transparent; font-size:18px; font-weight:600;
    }
    .edit-mode .add-card{display:flex}

    /* ---------- edit mode visuals (in-place editing) ---------- */
    .edit-mode [contenteditable="true"]{
      outline:none;
      background:rgba(255,250,200,.4);
      border-radius:6px;
      padding:2px 4px;
      margin:-2px -4px;
      transition:background .15s, box-shadow .15s;
    }
    .edit-mode [contenteditable="true"]:hover{
      background:rgba(255,240,150,.7);
    }
    .edit-mode [contenteditable="true"]:focus{
      background:#FFFFFF;
      box-shadow:0 0 0 2px var(--ink);
    }
    .edit-mode .card-body [contenteditable="true"]{
      min-height:1.5em;
    }
    .edit-mode .card-head [contenteditable="true"]{
      cursor:text;
    }
    .edit-mode-hint{
      display:none;
    }
    .edit-mode .edit-mode-hint{
      display:inline-block;
      background:var(--c-butter); border:1.5px solid var(--ink);
      border-radius:999px; padding:4px 12px; font-size:12px;
      margin-left:6px; font-weight:600;
    }

    /* ---------- color picker popover (inline) ---------- */
    .color-pop{
      display:none;
      position:absolute; top:calc(100% + 4px); right:0;
      background:var(--paper); border:2px solid var(--ink);
      border-radius:12px; padding:8px; gap:6px;
      box-shadow:var(--shadow); z-index:30;
      flex-wrap:wrap; max-width:200px;
    }
    .color-pop.show{display:flex}
    .color-swatch{
      width:26px; height:26px; border-radius:50%;
      border:2px solid var(--ink); cursor:pointer; padding:0;
    }
    .color-swatch.selected{outline:3px solid var(--ink); outline-offset:2px}
    .color-swatch.coral{background:var(--c-coral)}
    .color-swatch.butter{background:var(--c-butter)}
    .color-swatch.mint{background:var(--c-mint)}
    .color-swatch.sky{background:var(--c-sky)}
    .color-swatch.lilac{background:var(--c-lilac)}
    .color-swatch.rose{background:var(--c-rose)}

    .card-actions-wrap{position:relative; margin-left:auto}

    /* ---------- vocabulary ---------- */
    .vocab-table{
      width:100%; border-collapse:collapse; margin-top:6px;
    }
    .vocab-table th, .vocab-table td{
      border:1.5px solid var(--ink); padding:8px 10px;
      vertical-align:top; font-size:14px; text-align:left;
    }
    .vocab-table th{
      background:var(--c-sky); font-size:13px;
    }
    .vocab-table tr:nth-child(even) td{background:#F7F8FA}
    .vocab-table .word{font-weight:700; white-space:nowrap}
    .vocab-table .zh-cell{color:#444}
    .vocab-actions{display:none}
    .edit-mode .vocab-actions{display:table-cell}
    .vocab-table th.actions, .vocab-table td.actions{
      width:80px; text-align:center; white-space:nowrap;
    }

    /* ---------- english-only mode: hide ALL chinese ---------- */
    .english-only .zh,
    .english-only .zh-block,
    .english-only .zh-cell,
    .english-only .vocab-table th:nth-child(3),
    .english-only .vocab-table td:nth-child(3),
    .english-only .panel-intro .zh-block{
      display:none !important;
    }

    /* ---------- narrow embedded previews ---------- */
    @media (max-width:640px){
      main{padding-left:12px; padding-right:12px}
      .panel{padding:14px}
      .card-grid{grid-template-columns:minmax(0,1fr)}
    }

    /* ---------- print ---------- */
    @media print{
      .topbar, .tabs, .card-actions, .card-actions-wrap, .add-card,
      .tab-add, .vocab-actions, .color-pop, .edit-mode-hint,
      .copy-to-retell, .toast, .panel-actions{
        display:none !important;
      }
      body{background:white}
      main{padding:0}
      .panel{
        border:none; box-shadow:none; border-radius:0;
        page-break-inside:avoid;
      }
      .card{box-shadow:none; page-break-inside:avoid; margin-bottom:14px}
      .panel-printable + .panel-printable{page-break-before:always}
    }

    /* ---------- helpers ---------- */
    .hidden{display:none !important}
    .pill{
      display:inline-block; padding:2px 10px; border-radius:999px;
      background:var(--c-butter); font-size:12px; font-weight:600;
      border:1.5px solid var(--ink); margin-right:6px;
    }
    .saving-indicator{
      font-size:11px; color:var(--muted);
    }

    /* ---------- big question banner on the about tab ---------- */
    .hero{
      border:2px solid var(--ink); border-radius:18px;
      padding:18px 20px; margin-bottom:14px;
      background:linear-gradient(135deg, var(--c-butter), var(--c-rose));
      box-shadow:var(--shadow);
    }
    .hero h2{margin:0 0 4px; font-size:22px}
    .hero p{margin:0; font-size:15px}
    .hero .zh{display:block; color:#444; margin-top:4px}
  </style>
</head>

blue","contentEn":"Preview the two organizers. Ask learners to predict how a unit about a place can connect to people and culture.","contentZh":"先預覽兩張 organizer。請學習者預測地方主題如何連結到人與文化。"},{"title":"During learning","titleZh":"學習中","emoji":"🗣️","color":"green","contentEn":"Use one unit card at a time. Ask learners to name the concept, identify the people involved, and give one local example.","contentZh":"一次使用一張單元卡。請學習者說出概念、指出相關人物，並舉一個在地例子。"},{"title":"After learning","titleZh":"學習後","emoji":"🔁","color":"gold","contentEn":"Use each Book’s Big Idea and Retell frames to review the 25-unit sequence.","contentZh":"使用上下冊 Big Idea 與 Retell 句型複習各自的 25 單元順序。"}]},"tabOrder":["tab_about","tab_vocab","tab_story","tab_key","tab_extension","tab_retell","tab_tip"]};
const STORAGE_KEY = INITIAL_DATA.meta.storageKey || "science_courseware_v1";
const COLORS = ["coral","butter","mint","sky","lilac","rose"];

let state = loadState();
let editMode = false;
let langMode = "bi";   // "bi" or "en"
let activeTab = null;

/* ---------- state / persistence ---------- */
function freshState(){
  const fresh = JSON.parse(JSON.stringify(INITIAL_DATA));
  fresh.tabOrder = Object.keys(fresh).filter(k=>k.startsWith("tab_"));
  return fresh;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const obj = JSON.parse(raw);
      const savedVer = (obj && obj.meta && obj.meta.contentVersion) || 0;
      const currentVer = (INITIAL_DATA.meta && INITIAL_DATA.meta.contentVersion) || 0;
      // If the source content has been updated (newer version), ignore the
      // saved cache so the user sees the fresh content. Old edits are lost,
      // but that's the only way to push out content fixes.
      if(currentVer > savedVer){
        console.info(`Content updated (v${savedVer} → v${currentVer}); using fresh data.`);
        localStorage.removeItem(STORAGE_KEY);
        return freshState();
      }
      if(obj && obj.meta && obj.tab_about){
        // backfill new tabs from the canonical data if missing
        for(const k of Object.keys(INITIAL_DATA)){
          if(k.startsWith("tab_") && !obj[k]) obj[k] = INITIAL_DATA[k];
        }
        if(!obj.tabOrder){
          obj.tabOrder = INITIAL_DATA.tabOrder ||
            Object.keys(INITIAL_DATA).filter(k=>k.startsWith("tab_"));
        }
        return obj;
      }
    }
  }catch(e){ console.warn("loadState failed:", e); }
  return freshState();
}

let saveTimer = null;
function persist(){
  if(saveTimer) clearTimeout(saveTimer);
  document.getElementById("saving").textContent = "saving…";
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      document.getElementById("saving").textContent = "saved ✓";
      setTimeout(()=>{ document.getElementById("saving").textContent = ""; }, 1200);
    }catch(e){
      document.getElementById("saving").textContent = "save failed";
    }
  }, 250);
}

function resetState(){
  if(!confirm("Reset all edits and go back to the original courseware? 重設所有修改？")) return;
  state = freshState();
  localStorage.removeItem(STORAGE_KEY);
  activeTab = state.tabOrder[0];
  render();
}

/* ---------- helpers ---------- */
function escapeHtml(s){
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* Split a bilingual label like "About 簡介" or "Story 故事" into
   { en: "About", zh: "簡介" }. Falls back gracefully if no Chinese. */
function splitBilingual(label){
  const s = String(label||"").trim();
  const m = s.match(/^([^一-鿿]*?)\s*([一-鿿].*)?$/);
  if(!m) return { en: s, zh: "" };
  return { en: (m[1]||"").trim(), zh: (m[2]||"").trim() };
}

function tabOrder(){
  if(!state.tabOrder || !state.tabOrder.length){
    state.tabOrder = Object.keys(state).filter(k=>k.startsWith("tab_"));
  }
  // filter out missing tabs
  return state.tabOrder.filter(k => state[k]);
}

/* ---------- rendering ---------- */
function render(){
  if(!activeTab || !state[activeTab]) activeTab = tabOrder()[0];
  document.body.classList.toggle("edit-mode", editMode);
  document.body.classList.toggle("english-only", langMode === "en");
  document.getElementById("edit-toggle").classList.toggle("active", editMode);
  document.getElementById("lang-toggle").textContent = langMode === "en"
    ? "🌐 English" : "🌐 中英";
  renderTabs();
  renderPanels();
}

function renderTabs(){
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  tabOrder().forEach((k, idx) => {
    const tab = state[k];
    const split = splitBilingual(tab.name);
    const btn = document.createElement("button");
    btn.className = "tab" + (k === activeTab ? " active" : "");
    btn.dataset.tab = k;
    btn.innerHTML = `
      <span class="en">${escapeHtml(split.en)}</span>
      ${split.zh ? `<span class="zh"> ${escapeHtml(split.zh)}</span>` : ""}
      <span class="tab-actions">
        <button class="mini" title="Rename" data-act="rename">✎</button>
        <button class="mini" title="Move left" data-act="left">‹</button>
        <button class="mini" title="Move right" data-act="right">›</button>
        ${idx > 0 ? '<button class="mini" title="Delete tab" data-act="del">×</button>' : ""}
      </span>`;
    btn.addEventListener("click", e => {
      const act = e.target.dataset && e.target.dataset.act;
      if(act){
        e.stopPropagation();
        if(act === "rename") renameTab(k);
        if(act === "left") moveTab(k, -1);
        if(act === "right") moveTab(k, +1);
        if(act === "del") deleteTab(k);
        return;
      }
      activeTab = k;
      render();
    });
    wrap.appendChild(btn);
  });

  const add = document.createElement("button");
  add.className = "tab-add";
  add.textContent = "+ Add tab 新增標籤";
  add.addEventListener("click", addTab);
  wrap.appendChild(add);
}

function renderPanels(){
  const wrap = document.getElementById("panels");
  wrap.innerHTML = "";
  const k = activeTab;
  const tab = state[k];
  if(!tab) return;
  const panel = document.createElement("div");
  panel.className = "panel active panel-printable";
  panel.dataset.tab = k;

  const split = splitBilingual(tab.name);
  const header = document.createElement("div");
  header.className = "panel-header";
  header.innerHTML = `
    <h2>
      <span class="en">${escapeHtml(split.en)}</span>
      ${split.zh ? `<span class="zh">${escapeHtml(split.zh)}</span>` : ""}
    </h2>
    <div class="panel-actions">
      <button class="toolbtn" data-act="print-tab" title="Print just this tab (or save as PDF)">🖨️ Print this tab</button>
      <button class="toolbtn" data-act="export-tab-html" title="Download this tab as a standalone HTML file">📥 Save as HTML</button>
    </div>`;
  header.querySelector('[data-act="print-tab"]').addEventListener("click", () => printCurrentTab());
  header.querySelector('[data-act="export-tab-html"]').addEventListener("click", () => exportCurrentTabHTML());
  panel.appendChild(header);

  if(tab.intro){
    const intro = document.createElement("div");
    intro.className = "panel-intro";
    intro.innerHTML = `
      <div class="en-block" data-edit="${k}.intro.en">${tab.intro.en||""}</div>
      <div class="zh-block" data-edit="${k}.intro.zh">${tab.intro.zh||""}</div>`;
    panel.appendChild(intro);
  }

  if(k === "tab_about"){
    panel.appendChild(renderHero());
    panel.appendChild(renderCardGrid(k, tab.cards||[]));
  }else if(k === "tab_vocab"){
    panel.appendChild(renderVocab(tab.rows||[]));
  }else{
    panel.appendChild(renderCardGrid(k, tab.cards||[]));
  }

  wrap.appendChild(panel);
  // wire up contenteditable persistence
  attachEditableHandlers(panel);
}

function renderHero(){
  const m = state.meta;
  const div = document.createElement("div");
  div.className = "hero";
  div.innerHTML = `
    <span class="pill"><span class="en">${escapeHtml(m.series)}</span></span>
    <span class="pill"><span class="en">${escapeHtml(m.level)}</span></span>
    <h2 style="margin-top:8px"><span class="en">❓ Big Question</span> <span class="zh"> · 重要問題</span></h2>
    <p class="en"><strong data-edit="meta.bigQuestion">${escapeHtml(m.bigQuestion||"")}</strong></p>
    <p class="zh"><strong data-edit="meta.bigQuestionZh">${escapeHtml(m.bigQuestionZh||"")}</strong></p>
  `;
  return div;
}

function renderCardGrid(tabKey, cards){
  const grid = document.createElement("div");
  grid.className = "card-grid";
  cards.forEach((card, idx) => {
    grid.appendChild(renderCard(tabKey, card, idx));
  });
  const add = document.createElement("button");
  add.className = "add-card";
  add.textContent = "+ Add card 新增卡片";
  add.addEventListener("click", () => addCard(tabKey));
  grid.appendChild(add);
  return grid;
}

function renderCard(tabKey, card, idx){
  const div = document.createElement("div");
  div.className = "card " + (card.color || "sky");
  div.dataset.tab = tabKey;
  div.dataset.idx = idx;
  // copy button shows on every tab EXCEPT the retell tab itself
  const copyBtn = (tabKey !== "tab_retell")
    ? `<button class="copy-to-retell" title="Copy this card to the Retell tab" data-act="copy-retell">📋 → Retell</button>`
    : "";
  div.innerHTML = `
    <div class="card-head">
      <div class="emoji" data-edit="${tabKey}.cards.${idx}.emoji">${escapeHtml(card.emoji||"")}</div>
      <div class="titles">
        <div class="en" data-edit="${tabKey}.cards.${idx}.title">${escapeHtml(card.title||"")}</div>
        <div class="zh" data-edit="${tabKey}.cards.${idx}.titleZh">${escapeHtml(card.titleZh||"")}</div>
      </div>
      ${copyBtn}
      <div class="card-actions-wrap">
        <div class="card-actions">
          <button class="icon-btn" title="Color" data-act="color">🎨</button>
          <button class="icon-btn" title="Move up" data-act="up">↑</button>
          <button class="icon-btn" title="Move down" data-act="down">↓</button>
          <button class="icon-btn danger" title="Delete" data-act="del">🗑</button>
        </div>
        <div class="color-pop"></div>
      </div>
    </div>
    <div class="card-body">
      <div class="en-block" data-edit-html="${tabKey}.cards.${idx}.contentEn">${card.contentEn||""}</div>
      <div class="zh-block" data-edit-html="${tabKey}.cards.${idx}.contentZh">${card.contentZh||""}</div>
    </div>`;

  // copy-to-retell wiring
  const cBtn = div.querySelector(".copy-to-retell");
  if(cBtn){
    cBtn.addEventListener("click", e => {
      e.stopPropagation();
      copyToRetell(tabKey, idx, cBtn);
    });
  }

  div.querySelectorAll(".card-actions .icon-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if(act === "up")    moveCard(tabKey, idx, -1);
      if(act === "down")  moveCard(tabKey, idx, +1);
      if(act === "del")   deleteCard(tabKey, idx);
      if(act === "color") openColorPop(div, tabKey, idx);
    });
  });

  return div;
}

/* ---------- copy a card to the Retell tab ---------- */
function copyToRetell(tabKey, idx, btnEl){
  const src = state[tabKey] && state[tabKey].cards && state[tabKey].cards[idx];
  if(!src) return;
  if(!state.tab_retell){
    state.tab_retell = {
      name: "Retell 複述",
      cards: []
    };
    if(!state.tabOrder) state.tabOrder = tabOrder();
    if(!state.tabOrder.includes("tab_retell")) state.tabOrder.push("tab_retell");
  }
  const copy = JSON.parse(JSON.stringify(src));
  state.tab_retell.cards.push(copy);
  persist();
  // do NOT re-render to keep the user on their current tab
  // but flash the button so they know it worked
  if(btnEl){
    btnEl.classList.add("copied");
    btnEl.textContent = "✓ Copied!";
    setTimeout(() => {
      btnEl.classList.remove("copied");
      btnEl.textContent = "📋 → Retell";
    }, 1400);
  }
  showToast(`Copied to Retell ✓ · 已複製到「複述」標籤页`);
}

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- per-tab export ---------- */
function printCurrentTab(){
  // Active tab is already the only one in the DOM; just print directly.
  // (The global "Print" button expands all tabs; this one prints just this.)
  setTimeout(() => window.print(), 100);
}

function exportCurrentTabHTML(){
  const k = activeTab;
  if(!state[k]) return;
  // Pull the embedded styles from the current page so the saved file
  // looks identical to the on-screen tab.
  const styleEl = document.querySelector("style");
  const css = styleEl ? styleEl.textContent : "";
  // Render the selected panel into the existing panel container, capture it,
  // then restore the live view. Avoid duplicate DOM ids during export.
  const savedActive = activeTab;
  activeTab = k;
  renderPanels();
  const panelHtml = document.getElementById("panels").innerHTML;
  activeTab = savedActive;
  render();

  const split = splitBilingual(state[k].name);
  const tabTitle = (split.en || split.zh || "Tab") + (split.zh ? " " + split.zh : "");
  const docTitle = (state.meta.titleEn || "Courseware") + " · " + tabTitle;
  const filename = (state.meta.filenameStem || "courseware") + "_" + k + ".html";

  const html = [
    "<!DOCTYPE html>",
    "<html lang=\"en\">",
    "<head>",
    "<meta charset=\"UTF-8\">",
    "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
    "<title>" + escapeHtml(docTitle) + "</title>",
    "<style>" + css + "</style>",
    "<style>",
    /* Hide editor chrome on the exported file */
    ".topbar,.tabs,.toast,.card-actions,.card-actions-wrap,.add-card,.tab-add,",
    ".vocab-actions,.color-pop,.copy-to-retell,.panel-actions{display:none !important}",
    "body{padding:24px}",
    "main{padding:0}",
    ".panel{border-radius:18px}",
    ".tab-export-banner{",
    "  display:flex; align-items:center; gap:10px;",
    "  padding:8px 14px; margin-bottom:14px;",
    "  border:1.5px solid var(--ink); border-radius:999px;",
    "  background:var(--c-butter); font-size:13px; font-weight:600;",
    "}",
    ".tab-export-banner button{",
    "  border:1.5px solid var(--ink); background:white; color:var(--ink);",
    "  padding:4px 12px; border-radius:999px; font-weight:600; cursor:pointer;",
    "}",
    "@media print{ .tab-export-banner{display:none !important} body{padding:0} }",
    "</style>",
    "</head>",
    "<body>",
    "<div class=\"tab-export-banner\">",
    "  <span>📄 " + escapeHtml(docTitle) + "</span>",
    "  <span style=\"flex:1\"></span>",
    "  <button onclick=\"window.print()\">🖨️ Print / Save as PDF</button>",
    "</div>",
    "<main>" + panelHtml + "</main>",
    "</body></html>"
  ].join("\n");

  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast("Saved · 已下载 " + filename);
}

function openColorPop(cardEl, tabKey, idx){
  // close any other open popovers
  document.querySelectorAll(".color-pop.show").forEach(el => el.classList.remove("show"));
  const pop = cardEl.querySelector(".color-pop");
  pop.innerHTML = "";
  COLORS.forEach(c => {
    const sw = document.createElement("button");
    sw.className = "color-swatch " + c +
      (state[tabKey].cards[idx].color === c ? " selected" : "");
    sw.addEventListener("click", e => {
      e.stopPropagation();
      state[tabKey].cards[idx].color = c;
      persist(); render();
    });
    pop.appendChild(sw);
  });
  pop.classList.add("show");
  // close on outside click
  setTimeout(()=>{
    const closer = ev => {
      if(!pop.contains(ev.target)){
        pop.classList.remove("show");
        document.removeEventListener("click", closer);
      }
    };
    document.addEventListener("click", closer);
  }, 0);
}

function renderVocab(rows){
  const wrap = document.createElement("div");
  const tbl = document.createElement("table");
  tbl.className = "vocab-table";
  tbl.innerHTML = `
    <thead>
      <tr>
        <th><span class="en">Word</span> <span class="zh"> 單字</span></th>
        <th><span class="en">English meaning</span></th>
        <th><span class="zh">中文 / 提示</span></th>
        <th class="actions vocab-actions">Edit</th>
      </tr>
    </thead>
    <tbody></tbody>`;
  const tbody = tbl.querySelector("tbody");
  rows.forEach((row, idx) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="word" data-edit="tab_vocab.rows.${idx}.word">${escapeHtml(row.word||"")}</td>
      <td data-edit="tab_vocab.rows.${idx}.defEn">${escapeHtml(row.defEn||"")}</td>
      <td class="zh-cell" data-edit="tab_vocab.rows.${idx}.defZh">${escapeHtml(row.defZh||"")}</td>
      <td class="actions vocab-actions">
        <button class="icon-btn" title="Move up" data-act="up">↑</button>
        <button class="icon-btn" title="Move down" data-act="down">↓</button>
        <button class="icon-btn danger" title="Delete" data-act="del">🗑</button>
      </td>`;
    tr.querySelectorAll(".icon-btn").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if(act === "up")   moveVocab(idx, -1);
        if(act === "down") moveVocab(idx, +1);
        if(act === "del")  deleteVocab(idx);
      });
    });
    tbody.appendChild(tr);
  });
  wrap.appendChild(tbl);

  const addBtn = document.createElement("button");
  addBtn.className = "add-card";
  addBtn.style.marginTop = "12px";
  addBtn.textContent = "+ Add word 新增單字";
  addBtn.addEventListener("click", addVocab);
  wrap.appendChild(addBtn);

  return wrap;
}

/* ---------- in-place editing wiring ---------- */
function attachEditableHandlers(root){
  if(!editMode) return;
  // text-only fields (titles, emoji, vocab cells)
  root.querySelectorAll("[data-edit]").forEach(el => {
    el.setAttribute("contenteditable", "true");
    el.addEventListener("blur", () => {
      const path = el.dataset.edit;
      setByPath(state, path, el.innerText.trim());
      persist();
    });
    // prevent enter from creating <div> in single-line fields
    el.addEventListener("keydown", e => {
      if(e.key === "Enter"){
        e.preventDefault();
        el.blur();
      }
    });
  });
  // rich-html fields (card body)
  root.querySelectorAll("[data-edit-html]").forEach(el => {
    el.setAttribute("contenteditable", "true");
    el.addEventListener("blur", () => {
      const path = el.dataset.editHtml;
      setByPath(state, path, el.innerHTML.trim());
      persist();
    });
  });
}

function setByPath(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i = 0; i < parts.length - 1; i++){
    const key = parts[i];
    const next = parts[i+1];
    if(/^\d+$/.test(next)){
      if(!Array.isArray(cur[key])) cur[key] = [];
    } else {
      if(typeof cur[key] !== "object" || cur[key] === null) cur[key] = {};
    }
    cur = cur[key];
  }
  const last = parts[parts.length - 1];
  if(/^\d+$/.test(last)){
    cur[parseInt(last,10)] = value;
  } else {
    cur[last] = value;
  }
}

/* ---------- card / vocab / tab actions ---------- */
function moveCard(tabKey, idx, delta){
  const arr = state[tabKey].cards;
  const j = idx + delta;
  if(j < 0 || j >= arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  persist(); render();
}
function deleteCard(tabKey, idx){
  if(!confirm("Delete this card? 刪除这张卡片？")) return;
  state[tabKey].cards.splice(idx, 1);
  persist(); render();
}
function addCard(tabKey){
  const card = {
    title:"New card", titleZh:"新卡片", emoji:"✨", color:"sky",
    contentEn:"<p>Write English content here…</p>",
    contentZh:"<p>这里写中文内容……</p>"
  };
  if(!state[tabKey].cards) state[tabKey].cards = [];
  state[tabKey].cards.push(card);
  persist(); render();
}

function moveVocab(idx, delta){
  const arr = state.tab_vocab.rows;
  const j = idx + delta;
  if(j < 0 || j >= arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  persist(); render();
}
function deleteVocab(idx){
  if(!confirm("Delete this word? 刪除这个單字？")) return;
  state.tab_vocab.rows.splice(idx, 1);
  persist(); render();
}
function addVocab(){
  state.tab_vocab.rows.push({
    word:"new word", defEn:"meaning in English…", defZh:"中文釋義……"
  });
  persist(); render();
}

function renameTab(k){
  const cur = state[k].name;
  const next = prompt("Tab name 標籤名 (English 中文):", cur);
  if(next && next.trim()){ state[k].name = next.trim(); persist(); render(); }
}
function moveTab(k, delta){
  const order = state.tabOrder || tabOrder();
  const i = order.indexOf(k);
  const j = i + delta;
  if(i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  state.tabOrder = order;
  persist(); render();
}
function deleteTab(k){
  if(!confirm(`Delete tab "${state[k].name}"? 刪除整个標籤页？`)) return;
  delete state[k];
  state.tabOrder = (state.tabOrder || []).filter(x => x !== k);
  if(activeTab === k) activeTab = state.tabOrder[0];
  persist(); render();
}
function addTab(){
  const name = prompt("New tab name 新標籤名 (e.g. Activities 課堂活动):", "New Tab 新標籤");
  if(!name || !name.trim()) return;
  let key;
  do{ key = "tab_custom_" + Math.random().toString(36).slice(2,7); } while(state[key]);
  state[key] = {
    name: name.trim(),
    cards: [{
      title:"New card", titleZh:"新卡片", emoji:"✨", color:"sky",
      contentEn:"<p>Write English content here…</p>",
      contentZh:"<p>这里写中文内容……</p>"
    }]
  };
  state.tabOrder = (state.tabOrder || tabOrder()).concat([key]);
  activeTab = key;
  persist(); render();
}

/* ---------- top bar handlers ---------- */
document.getElementById("lang-toggle").onclick = () => {
  langMode = (langMode === "bi") ? "en" : "bi";
  render();
};
document.getElementById("edit-toggle").onclick = () => {
  editMode = !editMode;
  render();
};
document.getElementById("reset-btn").onclick = resetState;

document.getElementById("export-btn").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)],
                        {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (state.meta.filenameStem || "courseware") + ".json";
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById("import-btn").onclick =
  () => document.getElementById("import-file").click();
document.getElementById("import-file").onchange = e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const obj = JSON.parse(ev.target.result);
      if(!obj.meta) throw new Error("missing meta");
      state = obj;
      if(!state.tabOrder) state.tabOrder = Object.keys(state).filter(k=>k.startsWith("tab_"));
      activeTab = state.tabOrder[0];
      persist(); render();
      alert("Imported ✓");
    }catch(err){
      alert("Import failed: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
};
document.getElementById("print-btn").onclick = () => {
  // expand all panels for print
  const order = tabOrder();
  const panelsWrap = document.getElementById("panels");
  const savedActive = activeTab;
  const printablePanels = [];
  order.forEach(k => {
    activeTab = k;
    renderPanels();
    const rendered = panelsWrap.querySelector(".panel");
    if(rendered) printablePanels.push(rendered.cloneNode(true));
  });
  panelsWrap.innerHTML = "";
  printablePanels.forEach(panel => panelsWrap.appendChild(panel));
  activeTab = savedActive;
  setTimeout(() => {
    window.print();
    render();
  }, 300);
};

/* ---------- go ---------- */
render();
</script>
